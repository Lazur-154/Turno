<style>
:root{
  --ink:#0E2530;
  --ink-2:#16333F;
  --ink-3:#1E4150;
  --line:#2A5163;
  --bone:#ECEAE1;
  --bone-dim:#9FB0B8;
  --muted:var(--muted);
  --brass:#E0A82E;
  --brass-dark:#B8871F;
  --accent:#E0A82E;
  --ink-fixed:#0E2530;
  --verdigris:#3FA787;
  --rust:#C4553D;
  --r:4px;
  --pad:16px;
  --disp:"Barlow Condensed",ui-sans-serif,sans-serif;
  --body:"Barlow",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
/* Svetly rezim — prepina sa tlacidlom v hlavicke, ulozi sa v localStorage
   prehliadaca (per-zariadenie, nie je to firemne nastavenie v DB). */
:root[data-theme="light"]{
  --ink:#F6F2E9;
  --ink-2:#EFE8D6;
  --ink-3:#E4DAC0;
  --line:#D8CDB0;
  --bone:#1B2E38;
  --bone-dim:#5B6E76;
  --muted:#7C8B90;
  --accent:#8A6412;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--bone);
  font-family:var(--body);
  font-size:16px;
  line-height:1.45;
  min-height:100vh;
  min-height:100dvh;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{
  background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;color:var(--bone);width:100%;
}
textarea{resize:vertical;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.caps{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-weight:700;line-height:1.05}
.eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.18em;font-weight:600;font-size:12px;color:var(--bone-dim)}
.hide{display:none !important}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
header.bar{
  position:sticky;top:0;z-index:20;background:var(--ink);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:20px}
.brand b{color:var(--accent);font-weight:700}
.bar-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:380px){
  .bar-tools{gap:6px}
  .icon-btn{padding:10px 10px;font-size:12px}
  .langsel{padding:9px 8px;font-size:13px}
}
.lang{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lang button{font-family:var(--disp);font-weight:600;letter-spacing:.08em;font-size:13px;
  padding:12px 12px;min-height:44px;color:var(--bone-dim)}
.lang button[aria-pressed=true]{background:var(--brass);color:var(--ink-fixed)}
.langsel{width:auto;min-height:44px;padding:10px 12px;font-family:var(--disp);font-weight:600;
  letter-spacing:.04em;font-size:14px;background:var(--ink);border:1px solid var(--line);border-radius:var(--r)}
.icon-btn{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:44px;
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:13px;
  font-weight:600;color:var(--bone-dim)}
.bar-sub{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.bar-sub .date{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--bone-dim)}
.bar-sub .clock{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}

main{flex:1;padding:var(--pad);padding-bottom:96px;max-width:1180px;width:100%;margin:0 auto}

/* ---------- ribbon (today totals) ---------- */
.ribbon{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin-bottom:18px;
}
.ribbon div{background:var(--ink-2);padding:10px 12px}
.ribbon .k{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--bone-dim)}
.ribbon .v{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:2px}
.ribbon .v.on{color:var(--verdigris)}
.ribbon .v.money{color:var(--accent)}

/* ---------- punch card (signature) ---------- */
.cards{display:grid;gap:12px}
@media(min-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1080px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{
  position:relative;background:var(--ink-2);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 14px 14px 26px;
}
/* perforated stub edge */
.card::before{
  content:"";position:absolute;left:11px;top:10px;bottom:10px;width:0;
  border-left:2px dashed var(--line);
}
.card::after{
  content:"";position:absolute;left:6px;top:calc(50% - 6px);width:12px;height:12px;
  border-radius:50%;background:var(--ink);border:1px solid var(--line);
}
.card.working{border-color:var(--verdigris)}
.card.working::before{border-color:var(--verdigris)}
.card.done{opacity:.72}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.name{font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.05em;font-size:20px}
.rate{font-family:var(--mono);font-size:13px;color:var(--bone-dim);white-space:nowrap}
.plan{font-family:var(--mono);font-size:13px;color:var(--bone-dim);margin-top:2px}
.card-act{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.punch{
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:17px;
  padding:14px 22px;border-radius:var(--r);background:var(--brass);color:var(--ink-fixed);
  min-width:132px;text-align:center;transition:transform .08s ease;
}
.punch:active{transform:scale(.97)}
.punch.out{background:none;border:2px solid var(--verdigris);color:var(--verdigris)}
.punch.spent{background:none;border:1px solid var(--line);color:var(--bone-dim);font-weight:600}
.stamps{font-family:var(--mono);font-size:13px;line-height:1.5}
.stamps .row{display:flex;gap:8px}
.stamps .lbl{color:var(--bone-dim);min-width:56px}
.stamps .live{color:var(--verdigris);font-weight:600}
.stamps .tot{color:var(--accent);font-weight:600}
@keyframes stamp{
  0%{transform:scale(1.5) rotate(-7deg);opacity:0}
  60%{transform:scale(.94) rotate(1deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.stamped{display:inline-block;animation:stamp .34s cubic-bezier(.2,1.4,.4,1) both}
@media(prefers-reduced-motion:reduce){.stamped{animation:none}}

/* ---------- generic blocks ---------- */
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}
.sec-head h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:22px;margin:0;font-weight:700}
.btn{
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;font-weight:700;font-size:14px;
  padding:10px 16px;border-radius:var(--r);background:var(--brass);color:var(--ink-fixed);
}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--bone)}
.btn.danger{background:none;border:1px solid var(--rust);color:var(--rust);padding:7px 11px;font-size:12px}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--bone-dim)}
.empty p{margin:0 0 12px}
.nav-week{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.nav-week .lbl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:16px;font-weight:700}
.nav-week button{border:1px solid var(--line);border-radius:var(--r);padding:12px 20px;min-height:48px;
  min-width:52px;font-family:var(--mono);font-size:18px;color:var(--bone)}

/* day groups (rozvrh) — jeden riadok na den, detaily po tuknuti */
.day{border-bottom:1px solid var(--line)}
.day:first-of-type{border-top:1px solid var(--line)}
.day-row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 6px;min-height:62px;text-align:left}
.day-when{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:16px;
  font-weight:700;flex:0 0 auto;display:flex;align-items:center;gap:8px;color:var(--bone)}
.day-who{font-size:15px;color:var(--bone-dim);text-align:right;line-height:1.35}
.day-who .none{color:var(--muted);font-style:italic}
.day.is-today .day-when{color:var(--accent)}
.day.open{background:var(--ink-2)}
.day.open .day-row{border-bottom:1px dashed var(--line)}
.chip{font-family:var(--disp);font-size:10px;letter-spacing:.14em;padding:3px 7px;border-radius:2px;
  background:var(--brass);color:var(--ink-fixed);font-weight:700}
.day-body{padding:6px 6px 14px}
.shift-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line)}
.sr-name{font-weight:500;font-size:16px}
.sr-state{grid-column:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.sr-state .mono{font-family:var(--mono)}
.sr-state .dim{color:var(--bone-dim)}
.sr-btns{grid-row:1/3;grid-column:2;align-self:center;display:flex;flex-direction:column;gap:6px}
.sr-edit,.sr-del{border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;min-height:44px;font-size:12px;color:var(--bone-dim);
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-weight:600;white-space:nowrap}
.sr-edit{color:var(--accent);border-color:var(--accent)}
.sr-breaks{grid-column:1/-1}
.tagl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:10px;
  font-weight:700;padding:4px 7px;border-radius:2px}
.tagl.plan{background:var(--ink-3);color:var(--bone-dim)}
.tagl.on{background:var(--verdigris);color:var(--ink-fixed)}
.tagl.done{background:var(--ink-3);color:var(--verdigris)}
/* stare styly (uz nepouzite v Plane, drzime pre istotu) */
.day-group{border-top:1px solid var(--line);padding:12px 0}
.day-group:last-child{border-bottom:1px solid var(--line)}
.day-group.today .dg-h{color:var(--accent)}
.dg-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--disp);
  text-transform:uppercase;letter-spacing:.1em;font-size:14px;font-weight:600;margin-bottom:8px}
.dg-h .h{font-family:var(--mono);letter-spacing:0;color:var(--bone-dim);font-size:13px}
.line-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0}
.line-item .who{font-weight:500}
.line-item .when{font-family:var(--mono);font-size:14px;color:var(--bone-dim)}
.li-x{color:var(--bone-dim);font-family:var(--mono);padding:2px 8px;border:1px solid var(--line);border-radius:var(--r);font-size:12px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;
  color:var(--bone-dim);text-align:center;padding-bottom:4px;font-weight:600}
.cal .cell{
  aspect-ratio:1/1;min-height:44px;background:var(--ink-2);border:1px solid transparent;border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;
}
.cal .cell.mute{background:transparent;color:var(--muted)}
.cal .cell .d{font-family:var(--mono);font-size:13px}
.cal .cell .h{font-family:var(--mono);font-size:11px;color:var(--verdigris);font-weight:600}
.cal .cell.has{border-color:var(--line)}
.cal .cell.today{border-color:var(--accent)}
.cal .cell[aria-pressed=true]{background:var(--brass);color:var(--ink-fixed)}
.cal .cell[aria-pressed=true] .h{color:var(--ink-fixed)}

/* plan (mesacny rozvrh s initialmi) */
.plan-cell{aspect-ratio:auto;min-height:56px;padding:4px 2px}
.plan-chips{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:14px}
.plan-chip{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.02em;
  background:var(--ink-3);color:var(--bone-dim);border-radius:3px;padding:1px 3px;line-height:1.4}
.plan-cell.has .plan-chip{color:var(--verdigris)}
.plan-chip.more{color:var(--accent)}
.plan-cell[aria-pressed=true] .plan-chip{background:rgba(0,0,0,.18);color:var(--ink-fixed)}
.bp-emp-list{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);padding:4px}
.bp-emp-row{display:flex;align-items:center;gap:10px;padding:10px 8px;min-height:44px;font-size:15px}
.bp-emp-row input{width:20px;height:20px;flex:0 0 auto}
.bp-daypick{margin-top:2px}
.bp-daypick .cell{cursor:pointer}

/* table */
.panel{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:320px}
th{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:11px;
  color:var(--bone-dim);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:600}
th:first-child{text-align:left}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:14px}
td:first-child{text-align:left;font-family:var(--body);font-size:15px}
tr.brk-tr td{padding:0 0 10px;text-align:left}
tr.sum td{border-bottom:0;border-top:2px solid var(--line);color:var(--accent);font-weight:600}
tr.sum td:first-child{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em}

/* people */
.person{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line)}
.person .pname{font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.04em;font-size:18px}
.person .pcode{font-family:var(--mono);font-size:12px;color:var(--bone-dim)}
.rate-edit{display:flex;align-items:center;gap:5px}
.lg{font-size:13px;color:var(--bone-dim)}
.lg.now{color:var(--verdigris);font-weight:600}
.lg.none{color:var(--muted);font-style:italic}
.pcode b{font-family:var(--mono);color:var(--accent);font-size:14px;letter-spacing:.08em}
.rate-edit input{width:74px;text-align:right;font-family:var(--mono);padding:7px 8px}
.rate-edit span{font-family:var(--mono);font-size:13px;color:var(--bone-dim)}
.position-row{margin-top:6px}
.position-edit{max-width:220px;padding:6px 8px;font-size:13px;color:var(--bone-dim);border-color:var(--line)}
.position-edit::placeholder{color:var(--muted)}
@media(max-width:430px){
  .person{grid-template-columns:1fr auto;row-gap:10px}
  .person>div:first-child{grid-column:1/-1}
  .support-row{flex-direction:column}
  .support-row .btn{width:100%;min-width:0;white-space:normal}
}

/* form grid */
.fg{display:grid;gap:10px}
.fg label{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--bone-dim);display:block;margin-bottom:4px}
.fg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}


/* ---------- jednoduchy rezim: velke tlacidla, malo textu ---------- */
.punch-big{
  display:block;width:100%;margin-top:12px;
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:22px;
  padding:20px 16px;border-radius:var(--r);background:var(--brass);color:var(--ink-fixed);
  min-height:64px;transition:transform .08s ease;
}
.punch-big:active{transform:scale(.985)}
.punch-big.out{background:none;border:3px solid var(--verdigris);color:var(--verdigris);padding:17px 16px}
.punch-sec{display:block;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:var(--r);
  padding:14px;min-height:52px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;
  font-weight:600;font-size:15px;color:var(--bone-dim)}
.punch-sec:active{background:var(--ink-3)}
.status.pause{color:var(--accent);font-weight:500}
.card.paused{border-color:var(--accent)}
.card.paused::before{border-color:var(--accent)}
.status{font-size:16px;margin-top:4px;color:var(--bone-dim)}
.status.on{color:var(--verdigris);font-weight:500}
.status.fin{color:var(--bone-dim)}
.status b{font-family:var(--mono);font-weight:600;font-size:16px}
.bl{margin-top:10px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
  background:rgba(0,0,0,.14)}
.bl.compact{margin-top:8px;padding:8px 10px}
.bl-h{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:10px;
  font-weight:700;color:var(--bone-dim);margin-bottom:6px}
.bl-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;
  font-size:14px;padding:3px 0}
.bl-n{color:var(--muted);font-family:var(--mono);font-size:12px}
.bl-t{font-size:14px}
.bl-d{color:var(--accent);font-size:13px;text-align:right}
.bl-sum{border-top:1px solid var(--line);margin-top:5px;padding-top:6px}
.bl-sum .bl-t{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:11px;
  color:var(--bone-dim)}
.bl-sum .bl-d{font-weight:600}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;
  min-height:44px}
.undo-row{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:14px;color:var(--bone-dim)}
.undo-row button{color:var(--accent);font-weight:600;text-decoration:underline;

<div id="root"></div>
<noscript>
  <h1>Turno — evidencia dochádzky a zmien</h1>
  <p>Turno je jednoduchá evidencia dochádzky pre malé prevádzky — kaviarne, dielne,
     obchody a penzióny. Zamestnanci si zapíšu príchod a odchod v telefóne,
     majiteľ vidí odpracované hodiny aj mzdy na jednom mieste. Nič sa neinštaluje,
     appka beží v prehliadači. Do 3 zamestnancov zadarmo.</p>
  <h2>Turno — time and attendance tracking</h2>
  <p>Turno is simple time and attendance tracking for small businesses. Staff clock in
     and out on their phone, the owner sees hours worked and wages in one place.
     Nothing to install, it runs in the browser. Free for up to 3 people.</p>
  <p>Na používanie appky treba zapnutý JavaScript. / JavaScript is required.</p>
</noscript>

<script>
/* ============================================================

/* ---------------- cennik (plany podla poctu ludi) ----------------
   Platby idu cez Stripe Checkout (funkcia stripe-checkout) — key musi
   presne sedieť s TIERS v Supabase Edge Function, inak backend odmietne

/* ---------------- i18n (preklady su v lang.js) ---------------- */
const T = window.LANGS;
const LANG_CODES = Object.keys(T);
/* jazyk sa drzi v adrese: ...?lang=hr  — vlastnik moze poslat kazdemu
   zamestnancovi link uz v jeho jazyku a po instalacii na plochu to tak zostane */
function langFromUrl(){
  try{
    const v=new URLSearchParams(location.search).get('lang');
    if(v&&T[v]) return v;
  }catch(e){}
  /* Bez ?lang= sa riadime jazykom prehliadaca — Nemec ma otvori po nemecky,
     Anglican po anglicky. Ked jeho jazyk nemame, ostava slovencina. */
  try{
    const pref = navigator.languages || [navigator.language || ''];
    for(const l of pref){
      const code = String(l).slice(0,2).toLowerCase();
      if(T[code]) return code;
    }
  }catch(e){}
  return 'sk';
}
/* Vlastnik posle novemu clovekovi odkaz s ?join=KOD — appka to spozna
   a rovno mu ukaze "napis meno a pripoj sa" namiesto prihlasenia. */
/* QR plagat na stene vedie na ...?qr=TOKEN — appka si token zapamata
   a pouzije ho pri najblizsom pichnuti namiesto GPS. */
function qrFromUrl(){
  try{
    const v=new URLSearchParams(location.search).get('qr');
    if(v) return v;
  }catch(e){}
  return null;
}
function clearQrFromUrl(){
  try{
    const u=new URL(location.href);
    u.searchParams.delete('qr');
    history.replaceState(null,'',u);
  }catch(e){}
}
/* Skener v prevadzke vedie na ...?stanica=TOKEN — hocijake zariadenie s
   kamerou (mobil, tablet, stary telefon), ktore ostane pri vchode. Neriesi
   prihlasenie vobec, len skenuje osobne QR kody zamestnancov. */
function stationTokenFromUrl(){
  try{
    const v=new URLSearchParams(location.search).get('stanica');
    if(v) return v;
  }catch(e){}
  return null;
}
function joinCodeFromUrl(){
  try{ return new URLSearchParams(location.search).get('join'); }catch(e){ return null; }
}
function clearJoinFromUrl(){
  try{
    const u=new URL(location.href);
    u.searchParams.delete('join');
    history.replaceState(null,'',u);
  }catch(e){}
}
/* Po platbe Stripe presmeruje spat na ?checkout=success alebo ?checkout=cancel
   (viz success_url/cancel_url v Edge Function stripe-checkout). */
function checkoutStatusFromUrl(){
  try{ return new URLSearchParams(location.search).get('checkout'); }catch(e){ return null; }
}
function clearCheckoutFromUrl(){
  try{
    const u=new URL(location.href);
    u.searchParams.delete('checkout');
    history.replaceState(null,'',u);
  }catch(e){}
}
function setLang(code){
  if(!T[code])return;
  S.lang=code;
  document.documentElement.lang=code;
  try{
    const u=new URL(location.href);
    u.searchParams.set('lang',code);
    history.replaceState(null,'',u);
  }catch(e){}
}

/* ---------------- state ---------------- */
/* Kluc, pod ktorym drzime prihlasovaci kod zamestnanca v localStorage,
   aby ho refresh / potiahnutie zhora neodhlasilo (viz boot() a signin-emp). */
const EMP_CODE_KEY = 'turno_emp_code';
const S = {
  lang:'sk',   // prepise sa z adresy pri starte
  view:'today',
  role:null,          // 'owner' | 'employee'
  me:null,            // employee object when role==='employee'
  loginTab:'owner',
  loginErr:'',
  signupDone:false,
  joinCode:null,
  inviteCode:null,
  employees:[],
  shifts:[],
  notes:[],
  payments:[],          // zaznamy o vyplateni (kto, ktore dni, kolko, kedy)
  geoPermState:'unknown', // stav opravnenia na polohu v prehliadaci: granted|denied|prompt|unsupported|unknown
  calCursor:startOfMonth(new Date()),
  calPick:null,
  calFilter:null,        // ak nastavene, Historia ukazuje len tohto zamestnanca
  planCursor:startOfMonth(new Date()),
  planPick:null,        // vybrany den v Plane (mesacny kalendar)
  mineCursor:startOfMonth(new Date()),
  minePick:null,        // vybrany den v "Moje zmeny" (zamestnancov vlastny kalendar)
  justStamped:null,

  undo:null,           // {id, field} — kratke okno na vratenie

/* ---------------- helpers ---------------- */
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayISO(){return iso(new Date())}
/* Spyta sa prehliadac na polohu. Vrati null, ked to clovek nepovoli
   alebo GPS nechyti — volajuci sa potom rozhodne, co dalej. */
/* Databaza vracia chyby ako kratke kody, tu z nich robime vetu pre cloveka. */
function punchErr(e){
  const m = String((e&&e.message)||'');
  if(m.indexOf('prilis_daleko')>=0){
    const d = (m.match(/prilis_daleko:(\d+)/)||[])[1];
    return t('geoTooFar').replace('{m}', d||'?').replace('{r}', S.geoRadius);
  }
  if(m.indexOf('mimo_oblasti')>=0) return t('geoOutsideArea');
  if(m.indexOf('poloha_chyba')>=0) return t('geoNoFix');
  if(m.indexOf('zly_qr')>=0) return t('qrBad');
  if(m.indexOf('miesto_nenastavene')>=0) return t('geoWarnNoPlace');
  if(m.indexOf('zly_kod')>=0) return t('badCode');
  return t('readOnlyNote');
}
function getPos(timeoutMs){
  return new Promise(resolve=>{
    if(!navigator.geolocation) return resolve(null);
    let done=false;
    const t=setTimeout(()=>{ if(!done){ done=true; resolve(null); } }, timeoutMs||12000);
    navigator.geolocation.getCurrentPosition(
      pos=>{ if(done)return; done=true; clearTimeout(t);
             resolve({lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy}); },
      ()=>{ if(done)return; done=true; clearTimeout(t); resolve(null); },
      {enableHighAccuracy:true, timeout:timeoutMs||12000, maximumAge:30000});
  });
}
/* Zisti stav opravnenia na polohu bez toho, aby sme rovno pytali GPS
   (getPos() by pri stave 'prompt' hned vyvolal natívnu otazku prehliadaca).
   Vysledok si appka pamata v S.geoPermState a prekresli sa, ked sa zmeni —
   napr. ked clovek povolenie zapne/vypne priamo v nastaveniach telefonu. */
async function refreshGeoPermState(){
  try{
    if(!navigator.geolocation){ S.geoPermState='unsupported'; render(); return; }
    if(!navigator.permissions || !navigator.permissions.query){ S.geoPermState='unknown'; render(); return; }
    const st = await navigator.permissions.query({name:'geolocation'});
    S.geoPermState = st.state;
    if(!st.onchange){
      st.onchange = () => { S.geoPermState = st.state; render(); };
    }
  }catch(e){ S.geoPermState='unknown'; }
  render();
}
/* Ked ma firma zapnuty rezim "kazdy sam" s overovanim polohy, no zamestnanec
   sa este nerozhodol (ani nepovolil, ani nezakazal), poziadame o polohu
   rovno po prihlaseni — nech na to nemusi hladat tlacidlo. Na Androide sa
   nainstalovana appka v Nastaveniach telefonu s opravnenim na polohu objavi,
   az ked si appka o polohu aspon raz sama poziada — kym sa to nestane,
   clovek ju tam proste nema ako povolit. */
async function ensureGeoPermission(){
  if(S.role!=='employee' || !S.geoOn || S.punchMode!=='self') return;
  await refreshGeoPermState();
  if(S.geoPermState==='granted' || S.geoPermState==='denied') return;
  toast(t('geoLocating'));
  await getPos();
  await refreshGeoPermState();
}

/* Kolko dni zostava do konca predplatneho. Zaporne = uz vyprsalo. */
function subDaysLeft(){

  const end = new Date(String(S.platneDo).slice(0,10)+'T00:00:00');
  const now = new Date(todayISO()+'T00:00:00');
  return Math.round((end-now)/86400000);
}
/* Spravny tvar slova "den" podla cisla — sk: 1 den, 2 dni, 5 dni. */
function dayWord(n){
  const loc=(T[S.lang]&&T[S.lang].locale)||'sk-SK';
  const f=(T[S.lang]&&T[S.lang].dayForms)||{};
  let k='other';
  try{ k=new Intl.PluralRules(loc).select(n); }catch(e){}
  return f[k]||f.other||'';
}
function fmtDay(dstr){
  if(!dstr) return '';
  const loc=(T[S.lang]&&T[S.lang].locale)||'sk-SK';
  return new Date(String(dstr).slice(0,10)+'T00:00:00')
    .toLocaleDateString(loc,{day:'numeric',month:'long',year:'numeric'});
}
function mondayOf(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x}
function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function hhmm(ts){if(!ts)return'—';const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}
/* Postgres vracia time ako "16:00:00" — skrátime na HH:MM */
function hm(s){return s?String(s).slice(0,5):'—'}
/* Zmena nemusi byt naplanovana - niekto len zaskoci. Vtedy nepiseme "—–—". */
function planLabel(sh){
  if(!sh.plan_start && !sh.plan_end) return t('unplanned');
  return hm(sh.plan_start)+'\u2013'+hm(sh.plan_end);
}
function num(n,dec=2){
  const loc=(T[S.lang]&&T[S.lang].locale)||'sk-SK';
  return n.toLocaleString(loc,{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function cur(){return (T[S.lang]&&T[S.lang].cur)||'\u20ac'}
function money(n){return num(n,2)+' '+cur()}
/* ---- prestavky ----
   sh.breaks = [{s:ISO, e:ISO|null}, ...]  — kolko chce, nie len jedna.
   grossHoursOf = cas na pracovisku, breakHoursOf = sucet prestavok,
   hoursOf = CISTY odpracovany cas (to, co sa plati). */
function brs(sh){return Array.isArray(sh.breaks)?sh.breaks:[]}
/* Vypis kazdej prestavky od-do so dlzkou. Aby bolo vidno KEDY a AKO DLHO,
   nie len sucet. Pouzite na Dnes, v Plane aj v Historii. */
function breakList(sh,compact){
  const b=brs(sh); if(!b.length)return '';
  const cap = sh.departure ? new Date(sh.departure).getTime() : Date.now();
  const rows=b.map((x,i)=>{
    if(!x.s)return '';
    const st=new Date(x.s).getTime();
    const en=x.e?new Date(x.e).getTime():cap;
    const len=Math.max(0,(Math.min(en,cap)-st)/3600000);
    const to = x.e ? hhmm(x.e) : '\u2026';
    return `<div class="bl-row">
      <span class="bl-n">${i+1}.</span>
      <span class="bl-t mono">${hhmm(x.s)}\u2013${to}</span>
      <span class="bl-d">${durLong(len)}</span>
    </div>`;
  }).join('');
  return `<div class="bl ${compact?'compact':''}">
    <div class="bl-h">${t('breakDetail')}</div>
    ${rows}
    <div class="bl-row bl-sum">
      <span class="bl-n"></span>
      <span class="bl-t">${t('total')}</span>
      <span class="bl-d">${durLong(breakHoursOf(sh))}</span>
    </div>
  </div>`;
}
function onBreak(sh){const b=brs(sh);return b.length&&!b[b.length-1].e ? b[b.length-1] : null}
function grossHoursOf(sh,now=Date.now()){
  if(!sh.arrival)return 0;
  const end = sh.departure ? new Date(sh.departure).getTime() : now;
  return Math.max(0,(end-new Date(sh.arrival).getTime())/3600000);
}
function breakHoursOf(sh,now=Date.now()){
  const cap = sh.departure ? new Date(sh.departure).getTime() : now;
  return brs(sh).reduce((a,b)=>{
    if(!b.s)return a;
    const st=new Date(b.s).getTime();
    const en=b.e?new Date(b.e).getTime():cap;
    return a+Math.max(0,(Math.min(en,cap)-st)/3600000);
  },0);
}
function hoursOf(sh,now=Date.now()){
  return Math.max(0, grossHoursOf(sh,now)-breakHoursOf(sh,now));
}
/* trvanie SLOVAMI. "8:12" sa cita ako hodina na hodinach — to matie.
   "8 h 12 min" sa zamenit neda. */
function durLong(h){
  const m=Math.round(h*60), hh=Math.floor(m/60), mm=m%60;
  if(hh&&mm) return hh+' '+t('hUnit')+' '+mm+' '+t('minUnit');
  if(hh)      return hh+' '+t('hUnit');
  return mm+' '+t('minUnit');
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shiftsOn(date){

/* Demo-rezim: rovnaka logika ako databazove funkcie emp_punch_station a
   emp_punch_station_face — spolocna pre oba sposoby, ako sa zamestnanec
   pri stanici zapise (osobny QR kod, alebo teraz aj tvar). */
function demoStationPunch(me){
  const CUTOFF_MS=90*60000;
  const open=MEM.shifts.find(x=>x.employee_id===me.id&&x.date===todayISO()&&x.arrival&&!x.departure);
  const nowIso=new Date().toISOString(), nowMs=Date.now();
  const fillPlanned=()=>MEM.shifts.find(x=>x.employee_id===me.id&&x.date===todayISO()&&!x.arrival);
  if(!open){
    const planned=fillPlanned();
    let sh;
    if(planned){ planned.arrival=nowIso; sh=planned; }
    else{
      sh={id:'s'+Date.now()+Math.random().toString(36).slice(2,6),employee_id:me.id,date:todayISO(),
          plan_start:null,plan_end:null,arrival:nowIso,departure:null,breaks:[]};
      MEM.shifts.push(sh);
    }
    return {action:'in', name:me.name, shift:sh};
  }
  const list=Array.isArray(open.breaks)?open.breaks.slice():[];
  const last=list.length?list[list.length-1]:null;
  const openBrk=last&&!last.e;
  if(!openBrk){
    list.push({s:nowIso,e:null}); open.breaks=list;
    return {action:'break', name:me.name, shift:open};
  }
  const lastS=new Date(last.s).getTime();
  if(nowMs-lastS<=CUTOFF_MS){
    list[list.length-1]={...last,e:nowIso}; open.breaks=list;
    return {action:'back', name:me.name, shift:open};
  }
  open.departure=new Date(lastS+CUTOFF_MS).toISOString();
  const planned2=fillPlanned();
  let sh2;
  if(planned2){ planned2.arrival=nowIso; sh2=planned2; }
  else{
    sh2={id:'s'+Date.now()+Math.random().toString(36).slice(2,6),employee_id:me.id,date:todayISO(),
         plan_start:null,plan_end:null,arrival:nowIso,departure:null,breaks:[]};
    MEM.shifts.push(sh2);
  }
  return {action:'in', name:me.name, shift:sh2};
}

/* ---- odolnost voci vypadkom ----
   Ked appka chvilu bezi na pozadi (telefon v vrecku), prihlasenie moze
   medzitym vyprsat alebo siet na chvilu vypadne. Predtym to znamenalo
   tichu/nezrozumitelnu chybu pri najblizsom zapise. Teraz to sbop()
   skusi same opravit: pri chybe pripominajucej vyprsane prihlasenie
   obnovi session a zapis zopakuje, pri sietovej chybe chvilu pockia
   a tiez skusi znova. Az ked ani to nepomoze, chyba ide na obrazovku. */
function isRetryableErr(e){
  if(!e) return false;
  const msg = String((e.message||'')+' '+(e.code||'')+' '+(e.status||''));
  return /jwt|jws|token|expired|401|403|permission denied for|PGRST301|failed to fetch|networkerror|network error|load failed/i.test(msg);
}
async function sbop(factory){
  let res = await factory();
  if(res && res.error && isRetryableErr(res.error)){
    try{ if(sb) await sb.auth.refreshSession(); }catch(_){}
    await new Promise(r=>setTimeout(r,500));
    res = await factory();
  }
  if(res && res.error) throw res.error;
  return res ? res.data : undefined;
}

  async addEmployee(row){

      if(MEM.employees.length>=(MEM.settings.people_limit||3)) throw new Error('people_limit_reached');
      const e={id:'e'+Date.now(),...row};MEM.employees.push(e);return e;
    }
    // Kod sa moze zrazit s uz existujucim (unique owner_id+access_code).
    // Skusime az 6x s novym kodom, nez to vzdame.
    let lastErr=null;
    for(let attempt=0; attempt<6; attempt++){
      const payload = {...row, access_code: attempt===0 ? row.access_code : makeCode()};
      if(S.ownerId) payload.owner_id = S.ownerId;
      try{
        return await sbop(()=>sb.from('employees').insert(payload).select().single());
      }catch(error){
        lastErr=error;
        // 23505 = duplicitny zaznam -> ma zmysel skusit iny kod
        if(error.code!=='23505') break;
      }
    }
    throw lastErr;

  /* --- nastavenie, kto zapisuje prichody a pozyvaci kod pre novych ludi --- */

  async adminPrehlad(){

  /* Novy pozyvaci kod - stary link tym padom prestane fungovat.
     Uzitocne, ak si niekto cudzi kod niekde vsimol. */
  async regenerateInvite(){
    const code = Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
    if(!LIVE){ MEM.settings.invite_code=code; return code; }
    const payload = S.ownerId ? {owner_id:S.ownerId, invite_code:code} : {invite_code:code};
    await sbop(()=>sb.from('settings').upsert(payload,{onConflict:'owner_id'}));
    return code;
  },
  /* Novy clovek sa pripoji sam cez odkaz s pozyvacim kodom - vlastnik
     ho nemusi rucne pridavat. Databaza si sama overi, ci kod patri
     nejakemu vlastnikovi, a vytvori zamestnanca aj jeho pristupovy kod. */
  async selfRegister(inviteCode, name){
    if(!inviteCode) throw new Error('no invite');
    if(!LIVE){
      const e={id:'e'+Date.now(), name, hourly_rate:0, access_code:makeCode()};
      MEM.employees.push(e); return e;
    }
    const data = await sbop(()=>sb.rpc('emp_self_register',{p_invite:inviteCode, p_name:name}));
    return (data&&data[0])||null;
  },

  /* Zamestnanec si zapisuje sam. Ide to cez funkciu v databaze, ktora
     overi kod, ze zmena je jeho, ze je dnesna a ze to vlastnik povolil.
     Klient tomu neveri — rozhoduje databaza. */
  /* Zamestnanec prisel bez naplanovanej zmeny. Zmenu zalozi databaza,
     ktora zaroven overi, ze to vlastnik povolil. */
  async empStart(code){
    if(!LIVE){
      if(MEM.settings.punch_mode!=='self') throw new Error('not allowed');
      const me=MEM.employees.find(e=>String(e.access_code)===code);
      if(!me) throw new Error('unknown code');
      const open=MEM.shifts.find(x=>x.employee_id===me.id&&x.date===todayISO()&&x.arrival&&!x.departure);
      if(open) throw new Error('already on shift');
      const sh={id:'s'+Date.now(),employee_id:me.id,date:todayISO(),
                plan_start:null,plan_end:null,arrival:new Date().toISOString(),
                departure:null,breaks:[]};
      MEM.shifts.push(sh); return sh;
    }
    const data = await sbop(()=>sb.rpc('emp_start',{p_code:code}));
    return (data&&data[0])||null;
  },

  async empPunch(code, shiftId, action, pos, qr){
    if(!LIVE){
      if(MEM.settings.punch_mode!=='self') throw new Error('not allowed');
      const sh=MEM.shifts.find(x=>x.id===shiftId);
      const me=MEM.employees.find(e=>String(e.access_code)===code);
      if(!sh||!me||sh.employee_id!==me.id||sh.date!==todayISO()) throw new Error('not allowed');
      const nowIso=new Date().toISOString();
      const list=Array.isArray(sh.breaks)?sh.breaks.slice():[];
      const open=list.length&&!list[list.length-1].e ? list[list.length-1] : null;
      if(action==='in'  && !sh.arrival) sh.arrival=nowIso;
      if(action==='out' && sh.arrival && !sh.departure){
        if(open){ list[list.length-1]={...open,e:nowIso}; sh.breaks=list; }
        sh.departure=nowIso;
      }
      if(action==='break_start' && sh.arrival && !sh.departure && !open){
        list.push({s:nowIso,e:null}); sh.breaks=list;
      }
      if(action==='break_end' && open){ list[list.length-1]={...open,e:nowIso}; sh.breaks=list; }
      return sh;
    }
    const data = await sbop(()=>sb.rpc('emp_punch_geo',{
      p_code:code, p_shift:shiftId, p_action:action,
      p_lat:(pos&&pos.lat)??null, p_lon:(pos&&pos.lon)??null,
      p_acc:(pos&&pos.acc)??null, p_qr:qr||null}));
    return data||null;
  },

  /* Skener v prevadzke: appka sa sama rozhodne, ci ide o prichod alebo
     odchod (podla toho, ci ma clovek dnes uz otvorenu zmenu) — na stanici
     sa nekliká, len sa prilozi osobny QR kod. */
  async empPunchStation(code, stationToken){
    if(!LIVE){
      const me=MEM.employees.find(e=>String(e.access_code)===code);
      if(!me) throw new Error('zly_kod');
      return demoStationPunch(me);
    }
    const data = await sbop(()=>sb.rpc('emp_punch_station',{p_code:code, p_station:stationToken}));
    return data||null;
  },

  /* --- rozpoznavanie tvare pri stanici (experimentalna funkcia) ---
     Ukladanie/mazanie popisu tvare ide cez bezny authenticated update
     (RLS uz vlastnikovi zapis do vlastnych zamestnancov povoluje), takze
     tu netreba ziadnu novu RPC funkciu — tie su potrebne len tam, kde
     pristupuje anonymna stanica alebo zamestnanec bez prihlasenia. */
  async saveEmployeeFace(id, descriptors){
    if(!LIVE){
      const r=MEM.employees.find(e=>e.id===id);
      if(r){ r.face_descriptors=descriptors; r.face_consent_at=new Date().toISOString(); }
      return;
    }
    await sbop(()=>sb.from('employees').update({face_descriptors:descriptors, face_consent_at:new Date().toISOString()}).eq('id',id));
  },
  async clearEmployeeFace(id){
    if(!LIVE){
      const r=MEM.employees.find(e=>e.id===id);
      if(r){ r.face_descriptors=null; r.face_consent_at=null; }
      return;
    }
    await sbop(()=>sb.from('employees').update({face_descriptors:null, face_consent_at:null}).eq('id',id));
  },
  /* Stanica (anonymna, len s tokenom v URL) si dotiahne zoznam tvari
     vsetkych zamestnancov toho isteho vlastnika cez SECURITY DEFINER RPC. */
  async stationFaceData(stationToken){
    if(!LIVE){
      return MEM.employees.filter(e=>e.face_descriptors&&e.face_descriptors.length)
        .map(e=>({id:e.id, name:e.name, face_descriptors:e.face_descriptors}));
    }
    const data = await sbop(()=>sb.rpc('station_face_data',{p_station:stationToken}));
    return data||[];
  },
  async punchStationFace(employeeId, stationToken){
    if(!LIVE){
      const me=MEM.employees.find(e=>e.id===employeeId);
      if(!me) throw new Error('zly_kod');
      return demoStationPunch(me);
    }
    const data = await sbop(()=>sb.rpc('emp_punch_station_face',{p_employee_id:employeeId, p_station:stationToken}));
    return data||null;
  },

  async employeeShifts(code){
    if(!LIVE) {
      const me=MEM.employees.find(e=>String(e.access_code)===code);
      return me?MEM.shifts.filter(s=>s.employee_id===me.id):[];
    }
    const data = await sbop(()=>sb.rpc('emp_shifts',{p_code:code}));
    return data||[];
  }
};

/* ---------------- demo dataset ---------------- */
const MEM = {employees:[],shifts:[],notes:[
  {id:'n1',title:'Múka 25kg',details:'pre pekáreň, objednať do stredy',price:18.50,done:false,created_at:new Date(Date.now()-2*86400000).toISOString()},
  {id:'n2',title:'Olej do fritézy 10L',details:'',price:22,done:false,created_at:new Date(Date.now()-86400000).toISOString()},
  {id:'n3',title:'Obaly na donášku',details:'100ks, dodávateľ Packo',price:34.90,done:true,created_at:new Date(Date.now()-5*86400000).toISOString()}
],payments:[],settings:{punch_mode:'owner',invite_code:'DEM042',people_limit:3}};
function seedDemo(){
  const ago=m=>new Date(Date.now()-m*60000).toISOString();
  MEM.employees = [
    {id:'e1',name:'Martina Kollárová',hourly_rate:6.80,access_code:'104298',last_login:ago(4)},
    {id:'e2',name:'Peter Hudák',hourly_rate:7.20,access_code:'231765',last_login:ago(95)},
    {id:'e3',name:'Lucia Bednárová',hourly_rate:6.50,access_code:'358042',last_login:ago(60*30)},
    {id:'e4',name:'Tomáš Varga',hourly_rate:8.00,access_code:'472691',last_login:null},
    {id:'e5',name:'Simona Jurčová',hourly_rate:6.50,access_code:'519437',last_login:ago(8)}
  ];
  MEM.shifts=[];
  const patterns=[['08:00','16:00'],['16:00','23:00'],['10:00','18:00'],['12:00','20:00']];
  let n=0;
  const jitter=(base,spread)=>base+Math.floor(Math.random()*spread); // vzdy dopredu, nikdy do minusu

  // historia: 34 dni dozadu, realne prichody o par minut po plane
  for(let back=34;back>=1;back--){
    const d=addDays(new Date(),-back);
    const dow=d.getDay();
    const count=(dow===5||dow===6)?3:2;
    const pool=[...MEM.employees].sort(()=>Math.random()-0.5).slice(0,count);
    pool.forEach((e,i)=>{
      const [ps,pe]=patterns[i%patterns.length];
      const a=new Date(d); a.setHours(+ps.slice(0,2), jitter(0,9), 0,0);      // 08:00–08:08
      const b=new Date(d); b.setHours(+pe.slice(0,2), jitter(0,18), 0,0);     // 16:00–16:17
      const bk=[];
      const p1=new Date(a.getTime()+150*60000), p1e=new Date(p1.getTime()+30*60000);
      if(p1e<b) bk.push({s:p1.toISOString(),e:p1e.toISOString()});
      MEM.shifts.push({id:'s'+(++n),employee_id:e.id,date:iso(d),plan_start:ps,plan_end:pe,
        arrival:a.toISOString(),departure:b.toISOString(),breaks:bk});
    });
  }

  // DNES — musi vyzerat rozumne, ci to niekto otvori rano alebo v noci.
  // Predtym sa o 7:00 vygenerovala zmena "22:55–03:13", co vyzeralo pokazene.
  const td=todayISO(), now=new Date();
  const dayStart=new Date(now); dayStart.setHours(6,0,0,0);
  const push=(emp,ps,pe,arr,dep)=>MEM.shifts.push({id:'s'+(++n),employee_id:emp,date:td,
    plan_start:ps,plan_end:pe,arrival:arr?arr.toISOString():null,departure:dep?dep.toISOString():null});

  // jedna zmena prave bezi — prisiel pred ~3h, ale nikdy pred 6:00
  let runIn=new Date(now.getTime()-2*3600000);
  if(runIn<dayStart) runIn=new Date(now.getTime()-40*60000);
  const runEnd=(runIn.getHours()+8)%24;
  push('e2', pad(runIn.getHours())+':00', pad(runEnd)+':00', runIn, null);
  // bezicej zmene dame jednu uz ukoncenu prestavku, ak sa vojde
  const rs=new Date(runIn.getTime()+30*60000), re_=new Date(runIn.getTime()+45*60000);
  if(re_<now) MEM.shifts[MEM.shifts.length-1].breaks=[{s:rs.toISOString(),e:re_.toISOString()}];

  // jedna uzavreta zmena — musi existovat VZDY, inak sa v deme nikdy neukaze,
  // ako vyzera hotova turno ani tlacidlo Opravit.
  if(now.getHours()>=9){
    // denna zmena, skoncila pol hodiny dozadu
    const outT=new Date(now.getTime()-30*60000);
    const inT=new Date(outT.getTime()-5*3600000);
    push('e1', pad(inT.getHours())+':00', pad(outT.getHours())+':00', inT, outT);
    // 4 prestavky za zmenu — ukazka, ze ich moze byt kolko treba
    const mk=(offMin,lenMin)=>({s:new Date(inT.getTime()+offMin*60000).toISOString(),
                                e:new Date(inT.getTime()+(offMin+lenMin)*60000).toISOString()});
    MEM.shifts[MEM.shifts.length-1].breaks=[mk(50,15),mk(140,30),mk(215,10),mk(265,10)];
  }else{
    // rano: zaverecna z noci — pre bar uplne normalne
    const inT=new Date(now); inT.setDate(inT.getDate()-1); inT.setHours(22,0,0,0);
    const outT=new Date(now); outT.setHours(2,30,0,0);
    push('e1','22:00','02:30', inT, outT);
    // aj nocna zmena ma prestavky — demo musi vyzerat rovnako v ktorukolvek hodinu
    const mkn=(offMin,lenMin)=>({s:new Date(inT.getTime()+offMin*60000).toISOString(),
                                 e:new Date(inT.getTime()+(offMin+lenMin)*60000).toISOString()});
    MEM.shifts[MEM.shifts.length-1].breaks=[mkn(45,15),mkn(120,20),mkn(180,10),mkn(230,10)];
  }

  // dve caju na prichod
  push('e4','16:00','23:00',null,null);
  push('e3','17:00','23:00',null,null);

  // buduci tyzden — naplanovane, bez dochadzky
  for(let f=1;f<=6;f++){
    const d=addDays(new Date(),f);
    const pool=[...MEM.employees].sort(()=>Math.random()-0.5).slice(0,2);
    pool.forEach((e,i)=>{
      const [ps,pe]=patterns[i%2];
      MEM.shifts.push({id:'s'+(++n),employee_id:e.id,date:iso(d),plan_start:ps,plan_end:pe,
        arrival:null,departure:null});
    });
  }
}

/* Ak niekto zabudol dat odchod, jeho zmena z minulych dni zostava
   "otvorena" a hodiny mu potichu bezia dalej — na Dnes to inak nebolo
   vidno vobec, lebo zmena patri svojmu povodnemu dnu. Preto upozornime
   priamo hore, s tlacidlom Opravit. */
function staleOpenShifts(){
  const td=todayISO();
  return S.shifts.filter(s=>s.arrival && !s.departure && s.date!==td)
    .sort((a,b)=>a.date.localeCompare(b.date));
}
function staleWarning(){
  const stale=staleOpenShifts();
  if(!stale.length) return '';
  const rows=stale.map(s=>{
    const e=empById(s.employee_id); if(!e)return'';
    const d=new Date(s.date+'T00:00:00');
    return `<div class="quick-row">
      <span class="quick-name">${esc(e.name)} <span class="dim mono" style="font-size:12px">— ${t('unclosedSince')} ${d.getDate()}.${d.getMonth()+1}. ${hhmm(s.arrival)}</span></span>
      <button class="li-x" data-act="fix" data-id="${s.id}">${t('fix')}</button>
    </div>`;
  }).join('');
  return `<div class="panel" style="margin-bottom:18px;border-color:var(--rust)">
    <div class="eyebrow" style="margin-bottom:10px;color:var(--rust)">⚠ ${t('unclosedShifts')}</div>
    ${rows}
  </div>`;
}
/* ---------- DNES ---------- */
function viewToday(){
  const list=shiftsOn(todayISO());
  const now=Date.now();
  let working=[],hrs=0,cost=0;
  list.forEach(s=>{
    const e=empById(s.employee_id); if(!e)return;
    const h=hoursOf(s,now); hrs+=h; cost+=h*(+e.hourly_rate||0);
    if(s.arrival&&!s.departure)working.push(e.name.split(' ')[0]);
  });

  // jednoduchy rezim: jedna veta menami. podrobny: cisla.
  const head = staleWarning() + (S.detail ? `<div class="ribbon">
      <div><div class="k">${t('atWork')}</div><div class="v ${working.length?'on':''}">${working.length}</div></div>
      <div><div class="k">${t('hoursToday')}</div><div class="v" data-live="hours">${num(hrs,1)}</div></div>
      <div><div class="k">${t('costToday')}</div><div class="v money" data-live="cost">${money(cost)}</div></div>
    </div>`
    : `<p class="plainline ${working.length?'':'quiet'}">${
        working.length
          ? `${t('atWorkNames')}: <span class="nm">${working.map(esc).join(', ')}</span>`
          : t('nobodyAtWork')
      }</p>`);

  const toggle = `<button class="toggle" data-act="detail" aria-pressed="${S.detail}">
      <span class="switch"></span><span>${t('details')}</span></button>`;

  if(!S.employees.length){
    return head+`<div class="empty"><p>${t('noPeople')}</p>
      <button class="btn" data-act="view" data-v="people">${t('addPerson')}</button></div>`;
  }
  if(!list.length){
    // Ziadna naplanovana zmena NEZNAMENA, ze sa nedá dat prichod.
    // Preto tu musi byt aj zoznam ludi s tlacidlom Prichod teraz.
    return head+`<p class="plainline quiet">${t('noShiftsToday')}</p>
      ${unscheduledBlock(list)}
      <button class="addrow" data-act="new-shift" data-date="${todayISO()}">+ ${t('planShift')}</button>`;
  }
  // aktualne pracujuci hore, potom este nezacate, dokoncene na koniec —
  // pri viac ludoch je hned vidno, kto prave robi, bez skrolovania.
  const rank = s => (s.arrival && !s.departure) ? 0 : (!s.arrival ? 1 : 2);
  const sorted = [...list].sort((a,b)=>rank(a)-rank(b));
  return head+toggle+`<div class="cards">${sorted.map(card).join('')}</div>
    ${unscheduledBlock(list)}
    <button class="addrow" data-act="new-shift" data-date="${todayISO()}">+ ${t('addShift')}</button>`;
}

/* Kto dnes nie je v rozvrhu, ale zaskocil.
   Nemusis mu najprv planovat zmenu — das mu prichod a zmena sa zalozi sama. */
function unscheduledBlock(todayList){
  const busy=new Set(todayList.map(s=>s.employee_id));
  const free=S.employees.filter(e=>!busy.has(e.id));
  if(!free.length) return `<p class="help" style="margin-top:16px">${t('allHaveShift')}</p>`;
  return `<div class="panel" style="margin-top:20px">
    <div class="eyebrow" style="margin-bottom:10px">${t('notScheduled')}</div>
    ${free.map(e=>`<div class="quick-row">
      <span class="quick-name">${esc(e.name)}</span>
      <button class="quick-btn" data-act="quick-in" data-id="${e.id}">${t('startNow')}</button>
    </div>`).join('')}
  </div>`;
}

function card(s){
  const e=empById(s.employee_id); if(!e)return'';
  const br=onBreak(s);
  const st = s.departure ? 'done' : br ? 'paused' : s.arrival ? 'working' : '';
  const h=hoursOf(s), bh=breakHoursOf(s);
  const fresh = S.justStamped===s.id ? 'stamped' : '';
  const rate = S.detail ? `<div class="rate">${num(+e.hourly_rate||0,2)} ${cur()}/${t('hUnit')}</div>` : '';
  const showUndo = S.undo && S.undo.id===s.id;
  const brInfo = brs(s).length ? breakList(s,true) : '';
  // majitel musi mocт opravit hocico, aj zmenu ktora este nezacala
  const editBtn = `<button class="li-x" data-act="fix" data-id="${s.id}">${t('fix')}</button>`;

  let body;
  if(!s.arrival){
    body = `<div class="status">${t('shiftNotStarted')}</div>
      <button class="punch-big" data-act="punch-in" data-id="${s.id}">${t('arrive')}</button>
      <div class="card-foot"><span class="mono" style="font-size:14px;color:var(--bone-dim)">${t('plannedTime')}</span>${editBtn}</div>`;
  }else if(!s.departure && br){
    // na prestavke — najpravdepodobnejsi dalsi krok je jej koniec
    body = `<div class="status pause">${t('onBreakSince')} <b class="${fresh}">${hhmm(br.s)}</b></div>
      ${brInfo}
      <button class="punch-big" data-act="break-end" data-id="${s.id}">${t('breakEnd')}</button>
      <button class="punch-sec" data-act="punch-out" data-id="${s.id}">${t('leave')}</button>
      <div class="card-foot"><span></span>${editBtn}</div>`;
  }else if(!s.departure){
    const live = S.detail ? ` · <b data-tick="${s.id}">${durLong(h)}</b>` : '';
    body = `<div class="status on">${t('atWorkSince')} <b class="${fresh}">${hhmm(s.arrival)}</b>${live}</div>
      ${brInfo}
      <button class="punch-big out" data-act="punch-out" data-id="${s.id}">${t('leave')}</button>
      <button class="punch-sec" data-act="break-start" data-id="${s.id}">${t('breakStart')}</button>
      <div class="card-foot"><span></span>${editBtn}</div>`;
  }else{
    const money_ = S.detail ? ` · ${money(h*(+e.hourly_rate||0))}` : '';
    const netNote = bh>0 ? `<div class="status">${t('breaksLbl')}: ${durLong(bh)} · ${t('grossTime')} ${durLong(grossHoursOf(s))}</div>` : '';
    body = `<div class="status fin">${t('doneLbl')} · <b class="${fresh}">${durLong(h)}</b>${money_}</div>
      ${netNote}${brInfo}
      <div class="card-foot">
        <span class="mono" style="font-size:15px;color:var(--bone-dim)">${hhmm(s.arrival)} – ${hhmm(s.departure)}</span>
        <button class="li-x" data-act="fix" data-id="${s.id}">${t('fix')}</button>
      </div>`;
  }

  const undoRow = showUndo ? `<div class="undo-row"><span>${t('recorded')}</span>
      <button data-act="undo">${t('undo')}</button></div>` : '';

  return `<div class="card ${st}">
    <div class="card-top">
      <div>
        <div class="name">${esc(e.name)}</div>
        <div class="plan">${esc(planLabel(s))}</div>
      </div>
      ${rate}
    </div>
    ${body}${undoRow}
  </div>`;
}

/* ---------- ROZVRH (Plán) ----------
   Mesacny kalendar namiesto tyzdenneho zoznamu — vidno cely mesiac naraz,
   kazdy den ukazuje initialy pridelenych ludi. Tuknutim na den sa otvori
   detail nizsie (rovnaky panel pre cely mesiac, nie 7 samostatnych). Tlacidlo
   "+ Naplanovat" otvara hromadne priradenie: viacero ludi + viacero dni naraz. */
function viewPlan(){
  const c=S.planCursor, y=c.getFullYear(), m=c.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const lead=(first.getDay()+6)%7;
  const byDay={};
  S.shifts.forEach(s=>{
    const d=new Date(s.date+'T00:00:00');
    if(d.getFullYear()===y&&d.getMonth()===m){
      (byDay[s.date]=byDay[s.date]||[]).push(s);
    }
  });
  let cells='';
  for(let i=0;i<lead;i++)cells+=`<div class="cell mute"></div>`;
  for(let d=1;d<=last.getDate();d++){
    const key=`${y}-${pad(m+1)}-${pad(d)}`;
    const list=byDay[key]||[];
    const chips=list.slice(0,4).map(s=>{
      const e=empById(s.employee_id); if(!e)return'';
      return `<span class="plan-chip" title="${esc(e.name)}">${esc(initials(e.name))}</span>`;
    }).join('');
    const more=list.length>4?`<span class="plan-chip more">+${list.length-4}</span>`:'';
    cells+=`<button class="cell plan-cell ${list.length?'has':''} ${key===todayISO()?'today':''}"
      data-act="plan-pick" data-v="${key}" aria-pressed="${S.planPick===key}">
      <span class="d">${d}</span>
      <span class="plan-chips">${chips}${more}</span>
    </button>`;
  }
  const detail = S.planPick ? planDayDetail(S.planPick) : '';
  return `<div class="nav-week">
      <button data-act="plan-month" data-v="-1">‹</button>
      <span class="lbl">${T[S.lang].months[m]} ${y}</span>
      <button data-act="plan-month" data-v="1">›</button>
    </div>
    <button class="btn" style="width:100%;margin-bottom:14px" data-act="bulk-plan">+ ${t('planWeek')}</button>
    <p class="help">${t('tapDay')}</p>
    <div class="cal plan-cal">
      ${T[S.lang].dows.map(x=>`<div class="dow">${x}</div>`).join('')}
      ${cells}
    </div>
    ${detail}`;
}

    ${isToday?`<span class="chip">${t('todayChip')}</span>`:''}`;

/* ---------- KALENDÁR ---------- */
/* jednoduchy graf — naklady na mzdy za poslednych 14 dni, bez ziadnej kniznice */
function costTrendChart(){
  const DAYS=14;
  const end=new Date(); end.setHours(0,0,0,0);
  const start=addDays(end,-(DAYS-1));
  const byDay={};
  for(let i=0;i<DAYS;i++) byDay[iso(addDays(start,i))]=0;
  S.shifts.forEach(s=>{
    if(!(s.date in byDay)) return;
    if(S.calFilter && s.employee_id!==S.calFilter) return;
    const e=empById(s.employee_id); if(!e) return;
    byDay[s.date]+=hoursOf(s)*(+e.hourly_rate||0);
  });
  const vals=Object.keys(byDay).sort().map(k=>({date:k,v:byDay[k]}));
  const max=Math.max(1,...vals.map(v=>v.v));
  const W=336,H=88,GAP=3,BW=(W-GAP*(DAYS-1))/DAYS;
  const bars=vals.map((v,i)=>{
    const h=v.v>0?Math.max(3,(v.v/max)*(H-14)):1;
    const x=i*(BW+GAP), y=H-h;
    const d=new Date(v.date+'T00:00:00');
    const lbl=`${pad(d.getDate())}.${pad(d.getMonth()+1)}. — ${money(v.v)}`;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${BW.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" class="bar-mark${v.date===todayISO()?' bar-today':''}"><title>${esc(lbl)}</title></rect>`;
  }).join('');
  const total=vals.reduce((a,v)=>a+v.v,0);
  return `<div class="panel chart-panel" style="margin-bottom:18px">
    <div class="eyebrow" style="margin-bottom:2px">${t('costTrend')}</div>
    <div class="chart-sum">${money(total)}<span class="chart-sum-lbl">${t('last14days')}</span></div>
    <svg viewBox="0 0 ${W} ${H}" class="bar-chart" role="img" aria-label="${esc(t('costTrend'))}">${bars}</svg>
  </div>`;
}
function viewCal(){
  const c=S.calCursor, y=c.getFullYear(), m=c.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const lead=(first.getDay()+6)%7;
  const filt=S.calFilter;
  const byDay={};
  S.shifts.forEach(s=>{
    if(filt && s.employee_id!==filt) return;
    const d=new Date(s.date+'T00:00:00');
    if(d.getFullYear()===y&&d.getMonth()===m){
      byDay[s.date]=(byDay[s.date]||0)+hoursOf(s);
    }
  });
  let cells='';
  for(let i=0;i<lead;i++)cells+=`<div class="cell mute"></div>`;
  for(let d=1;d<=last.getDate();d++){
    const key=`${y}-${pad(m+1)}-${pad(d)}`;
    const h=byDay[key]||0;
    cells+=`<button class="cell ${h?'has':''} ${key===todayISO()?'today':''}"
      data-act="pickday" data-v="${key}" aria-pressed="${S.calPick===key}">
      <span class="d">${d}</span>${h?`<span class="h">${num(h,1)}</span>`:''}</button>`;
  }

  // mesačný súhrn (respektuje filter, ak je nastaveny)
  const rows=S.employees.filter(e=>!filt||e.id===filt).map(e=>{
    let h=0;
    S.shifts.forEach(s=>{
      if(s.employee_id!==e.id)return;
      const dd=new Date(s.date+'T00:00:00');
      if(dd.getFullYear()===y&&dd.getMonth()===m)h+=hoursOf(s);
    });
    return {e,h,c:h*(+e.hourly_rate||0)};
  }).filter(r=>r.h>0);
  const sumH=rows.reduce((a,r)=>a+r.h,0), sumC=rows.reduce((a,r)=>a+r.c,0);

  const detail = S.calPick ? dayDetail(S.calPick) : '';

  const filterSel = S.employees.length>1 ? `<select class="langsel" data-act="cal-filter" style="margin-bottom:12px;width:100%">
    <option value="">${t('allEmployees')}</option>
    ${S.employees.map(e=>`<option value="${e.id}" ${filt===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}
  </select>` : '';

  return costTrendChart()+`<div class="nav-week">
      <button data-act="month" data-v="-1">‹</button>
      <span class="lbl">${T[S.lang].months[m]} ${y}</span>
      <button data-act="month" data-v="1">›</button>
    </div>
    ${filterSel}
    <p class="help">${t('legendHours')}</p>
    <div class="cal">
      ${T[S.lang].dows.map(x=>`<div class="dow">${x}</div>`).join('')}
      ${cells}
    </div>
    ${detail}
    <div class="panel" style="margin-top:18px">
      <div class="sec-head" style="margin:0 0 10px">
        <div class="eyebrow" style="margin:0">${t('monthTotal')}</div>
        ${rows.length?`<button class="linkish" data-act="export-csv">⬇ ${t('exportCsvBtn')}</button>`:''}
      </div>
      ${rows.length?`<table>
        <thead><tr><th>${t('person')}</th><th>${t('hours')}</th><th>€/h</th><th>${t('cost')}</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td>${esc(r.e.name)}</td><td>${num(r.h,1)}</td>
          <td>${num(+r.e.hourly_rate||0,2)}</td><td>${money(r.c)}</td></tr>`).join('')}
          <tr class="sum"><td>${t('total')}</td><td>${num(sumH,1)}</td><td></td><td>${money(sumC)}</td></tr>
        </tbody></table>`:`<div style="color:var(--bone-dim);font-size:14px">${t('noRecord')}</div>`}
    </div>`;
}

function dayDetail(key){
  const list=shiftsOn(key).filter(s=>!S.calFilter||s.employee_id===S.calFilter);
  const d=new Date(key+'T00:00:00');
  const head=`${T[S.lang].dayNames[d.getDay()]} ${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()}`;
  if(!list.length)return `<div class="panel" style="margin-top:14px">
    <div class="eyebrow">${head}</div>
    <div style="color:var(--bone-dim);font-size:14px;margin-top:8px">${t('noRecord')}</div></div>`;
  let sh=0,sc=0;
  const body=list.map(s=>{
    const e=empById(s.employee_id);if(!e)return'';
    const h=hoursOf(s), c=h*(+e.hourly_rate||0); sh+=h; sc+=c;
    const bb=breakHoursOf(s);
    const pay = s.departure ? paymentForDate(e.id, s.date) : null;
    const paidNote = pay ? `<br><span class="paid-badge">\u2713 ${esc(t('paidLbl'))} ${esc(fmtDay(pay.created_at))} \u00b7 ${esc(hhmm(pay.created_at))}</span>` : '';
    return `<tr><td>${esc(e.name)}</td><td>${hhmm(s.arrival)}</td>
      <td>${s.departure?hhmm(s.departure):'\u2026'}</td>
      <td>${bb>0?num(bb,1):'\u2013'}</td><td>${num(h,1)}</td>
      <td>${money(c)}${paidNote}</td>
      <td style="text-align:right"><button class="sr-edit" data-act="fix" data-id="${s.id}">${t('fix')}</button></td></tr>
      ${brs(s).length?`<tr class="brk-tr"><td colspan="7">${breakList(s,true)}</td></tr>`:''}`;
  }).join('');
  return `<div class="panel" style="margin-top:14px">
    <div class="eyebrow" style="margin-bottom:10px">${head}</div>
    <table><thead><tr><th>${t('person')}</th><th>${t('arrived')}</th><th>${t('left')}</th>
      <th>${t('breaksLbl')}</th><th>${t('hours')}</th><th>${t('cost')}</th><th></th></tr></thead>
      <tbody>${body}<tr class="sum"><td>${t('total')}</td><td></td><td></td><td></td>
      <td>${num(sh,1)}</td><td>${money(sc)}</td><td></td></tr></tbody></table></div>`;
}

/* ---------- EXPORT PRE MZDY ----------
   CSV so strojcek (nie kniznica) — otvara sa priamo v Exceli. Oddelovac ';'
   a desatinna ciarka, lebo tak caka Excel v slovenskom nastaveni; inak by
   po dvojkliku rozhadzal cisla do jedneho stlpca. */
function csvVal(v){
  const s=String(v??'');
  return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvLine(arr){ return arr.map(csvVal).join(';'); }
function downloadTextFile(filename, content){
  const blob=new Blob(['﻿'+content], {type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
/* Export za mesiac, ktory je prave otvoreny v Kalendari (S.calCursor):
   detail kazdej zmeny + mesacny suhrn na konci, presne to, co uctovnicka
   potrebuje na spracovanie miezd. */
function exportMonthCsv(){
  const c=S.calCursor, y=c.getFullYear(), m=c.getMonth();
  const inMonth = S.shifts
    .map(s=>({s, e:empById(s.employee_id)}))
    .filter(x=>{
      if(!x.e) return false;
      const d=new Date(x.s.date+'T00:00:00');
      return d.getFullYear()===y && d.getMonth()===m;
    })
    .sort((a,b)=> a.e.name.localeCompare(b.e.name,'sk') || a.s.date.localeCompare(b.s.date));

  const lines=[];
  lines.push(csvLine(['Meno','Dátum','Príchod','Odchod','Prestávka (h)','Odpracované (h)','Sadzba (€/h)','Suma (€)','Vyplatené','Vyplatené kedy (dátum a čas)']));
  inMonth.forEach(({s,e})=>{
    const h=hoursOf(s), br=breakHoursOf(s), rate=+e.hourly_rate||0;
    const dd=new Date(s.date+'T00:00:00');
    const pay = s.departure ? paymentForDate(e.id, s.date) : null;
    lines.push(csvLine([
      e.name,
      pad(dd.getDate())+'.'+pad(dd.getMonth()+1)+'.'+dd.getFullYear(),
      hhmm(s.arrival),
      s.departure ? hhmm(s.departure) : '',
      num(br,2), num(h,2), num(rate,2), num(h*rate,2),
      pay ? 'Áno' : 'Nie',
      pay ? fmtDay(pay.created_at)+' '+hhmm(pay.created_at) : ''
    ]));
  });

  lines.push('');
  lines.push(csvLine(['SÚHRN ZA MESIAC '+(m+1)+'/'+y]));
  lines.push(csvLine(['Meno','Odpracované (h)','Suma (€)']));
  let sumH=0, sumC=0;
  S.employees.slice().sort((a,b)=>a.name.localeCompare(b.name,'sk')).forEach(e=>{
    let h=0;
    S.shifts.forEach(s=>{
      if(s.employee_id!==e.id) return;
      const dd=new Date(s.date+'T00:00:00');
      if(dd.getFullYear()===y && dd.getMonth()===m) h+=hoursOf(s);
    });
    if(h<=0) return;
    const c2=h*(+e.hourly_rate||0);
    sumH+=h; sumC+=c2;
    lines.push(csvLine([e.name, num(h,2), num(c2,2)]));
  });
  lines.push(csvLine(['Spolu', num(sumH,2), num(sumC,2)]));

  /* Zaznamy o vyplateni — nech je aj vo vytlacenom/exportovanom prehlade
     jasne vidno, ze bolo zaplatene, komu, kolko a kedy presne to majitel
     zaznamenal (nie len ktore dni to pokryva). */
  const payRows = (S.payments||[]).slice().sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
  if(payRows.length){
    lines.push('');
    lines.push(csvLine(['VYPLATENÉ (záznamy o výplatách)']));
    lines.push(csvLine(['Meno','Vyplatené dni','Suma (€)','Kedy zaznamenané']));
    payRows.forEach(p=>{
      const e=empById(p.employee_id); if(!e) return;
      const dates=(Array.isArray(p.dates)?p.dates:[]).slice().sort();
      if(!dates.length) return;
      const rangeLbl = dates.length<=1
        ? fmtDay(dates[0])
        : fmtDay(dates[0])+' – '+fmtDay(dates[dates.length-1])+' ('+dates.length+' dní)';
      const when = p.created_at ? fmtDay(p.created_at)+' '+hhmm(p.created_at) : '';
      lines.push(csvLine([e.name, rangeLbl, num(+p.amount||0,2), when]));
    });
  }

  downloadTextFile('turno-mzdy-'+y+'-'+pad(m+1)+'.csv', lines.join('\r\n'));
}

function loginInfo(e){
  if(!e.last_login) return `<span class="lg none">${t('neverLoggedIn')}</span>`;
  const d=new Date(e.last_login), now=new Date();
  const mins=(now-d)/60000;
  if(mins<15) return `<span class="lg now">\u25cf ${t('loggedInNow')}</span>`;
  const sameDay = d.toDateString()===now.toDateString();
  const when = sameDay ? hhmm(e.last_login)
    : `${d.getDate()}. ${d.getMonth()+1}. ${hhmm(e.last_login)}`;
  return `<span class="lg">${t('lastLogin')}: ${when}</span>`;
}

/* ---------- VYPLATENÉ ----------
   Zoznam dni, ktore uz nejaka vyplata pokryva (naprieč vsetkymi zaznamami
   toho zamestnanca) — pouziva sa aj na zvyrazenie v kalendari, aj na to,
   aby sa uz vyplatene dni druhy krat neponukali na vyber. */
function paidDatesForEmp(employeeId){
  const set=new Set();
  (S.payments||[]).forEach(p=>{
    if(p.employee_id!==employeeId) return;
    (Array.isArray(p.dates)?p.dates:[]).forEach(d=>set.add(d));
  });
  return set;
}
/* Odpracovane (dokoncene) zmeny tohto zamestnanca, za ktore este nebolo
   zaznamenane vyplatenie — zoradene od najnovsich, nech ma majitel hned
   pri ruke ten najbeznejsi pripad (vyplatit poslednych par dni). */
function unpaidShiftsForEmp(employeeId){
  const paid=paidDatesForEmp(employeeId);
  return S.shifts
    .filter(s=>s.employee_id===employeeId && s.departure && !paid.has(s.date))
    .sort((a,b)=>b.date.localeCompare(a.date));
}
/* Ktory konkretny zaznam o vyplateni pokryva tento den — potrebujeme to,
   aby sme pri kazdej zmene vedeli ukazat PRESNE KEDY bola vyplatena
   (nie len ze je vyplatena), a to aj v tlacenom/exportovanom prehlade. */
function paymentForDate(employeeId, date){
  return (S.payments||[]).find(p=>p.employee_id===employeeId &&
    Array.isArray(p.dates) && p.dates.includes(date));
}
/* Vsetky zaznamy o vyplateni tohto zamestnanca, najnovsie hore — pouziva
   sa v "Historii vyplat", odkial sa da omylom zaznamenane vyplatenie
   aj zrusit (dni sa vratia medzi nevyplatene). */
function paymentsForEmp(employeeId){
  return (S.payments||[]).filter(p=>p.employee_id===employeeId)
    .sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
}
/* Celkovo zarobene (vsetky dokoncene zmeny × aktualna sadzba — appka si
   historicku sadzbu nepamata, rovnaky zjednodusujuci princip ako CSV export),
   uz vyplatene, a rozdiel = kolko sa este ma vyplatit. */
function empTotals(e){
  const rate=+e.hourly_rate||0;
  const earned=S.shifts.filter(s=>s.employee_id===e.id && s.departure)
    .reduce((a,s)=>a+hoursOf(s)*rate,0);
  const paid=(S.payments||[]).filter(p=>p.employee_id===e.id)
    .reduce((a,p)=>a+(+p.amount||0),0);
  return {earned, paid, remaining: Math.max(0, earned-paid)};
}

function openGeoMapModal(){
  openModal(geoMapModalBody());
  const isPoly = S.geoMode==='polygon';
  const initial = isPoly
    ? (Array.isArray(S.geoPolygon)?S.geoPolygon:[]).map(p=>[p.lat,p.lon])
    : (S.geoLat!==null&&S.geoLon!==null ? [[S.geoLat,S.geoLon]] : []);
  const center = initial.length ? initial[0] : [48.6690,19.6990];
  const zoom = initial.length ? 17 : 7;
  const map = L.map('geo-map-el').setView(center, zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'© OpenStreetMap'
  }).addTo(map);
  const st = { map, points: initial.map(p=>({lat:p[0],lng:p[1]})), markers:[], shape:null, circle:null };
  window.__geoMapState = st;
  redrawGeoMap();
  if(initial.length>1) map.fitBounds(L.latLngBounds(initial));
  /* ak este nic nie je nastavene, skusi (bez blokovania) vycentrovat na polohu telefonu */
  if(!initial.length){
    getPos(6000).then(pos=>{
      if(pos && window.__geoMapState===st) map.setView([pos.lat,pos.lon], 16);
    });
  }
  map.on('click', e=>{
    const cur = window.__geoMapState; if(!cur) return;
    const isPolyNow = S.geoMode==='polygon';
    if(isPolyNow) cur.points.push(e.latlng);
    else cur.points = [e.latlng];
    redrawGeoMap();
  });
}
function geoMapAccent(){
  try{ return getComputedStyle(document.documentElement).getPropertyValue('--verdigris').trim()||'#3FA787'; }
  catch(e){ return '#3FA787'; }
}
function redrawGeoMap(){
  const st = window.__geoMapState; if(!st) return;
  const accent = geoMapAccent();
  st.markers.forEach(m=>st.map.removeLayer(m)); st.markers=[];
  if(st.shape){ st.map.removeLayer(st.shape); st.shape=null; }
  if(st.circle){ st.map.removeLayer(st.circle); st.circle=null; }
  const isPoly = S.geoMode==='polygon';
  st.points.forEach(ll=>{
    st.markers.push(L.circleMarker(ll,{radius:6,color:accent,weight:2,fillColor:accent,fillOpacity:0.9}).addTo(st.map));
  });
  if(isPoly){
    if(st.points.length>=3) st.shape=L.polygon(st.points,{color:accent,weight:2,fillOpacity:0.18}).addTo(st.map);

function drawQR(){

  if(!box||!S.qrToken) return;
  const url=`${location.origin}${location.pathname}?qr=${encodeURIComponent(S.qrToken)}`;
  const go=()=>{
    try{
      const q=window.qrcode(0,'M'); q.addData(url); q.make();
      box.innerHTML=q.createSvgTag({cellSize:5, margin:0, scalable:true});
      const svg=box.querySelector('svg');
      if(svg){ svg.style.width='100%'; svg.style.maxWidth='260px'; svg.style.height='auto'; }
    }catch(e){ box.textContent=url; }
  };
  if(window.qrcode) return go();
  /* Kniznicu mame priamo v projekte (qr.js), nie z cudzieho servera —
     QR kod sa vykresli aj bez internetu a nikto nas nemoze odstrihnut. */
  const sc=document.createElement('script');
  sc.src='qr.js';
  sc.onload=go;
  sc.onerror=()=>{ box.textContent=url; };
  document.head.appendChild(sc);
}

function loadScriptOnce(src){
  return new Promise(res=>{
    if(document.querySelector('script[data-src="'+src+'"]')){ res(); return; }
    const sc=document.createElement('script');
    sc.src=src; sc.dataset.src=src;
    sc.onload=()=>res(); sc.onerror=()=>res();
    document.head.appendChild(sc);
  });
}
/* Rozpoznavanie tvare (experimentalna funkcia) — kniznica sa dotiahne az
   ked ju niekto naozaj potrebuje (nastavovanie tvare zamestnanca, alebo
   stanica, ktora ma aspon jedneho zamestnanca s ulozenou tvarou), nech
   to nezatazuje appku vsetkym ostatnym. */
const FACE_CDN = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js';
const FACE_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model';
const FACE_SAMPLES = 3;
const FACE_MATCH_THRESHOLD = 0.55;
let faceModelsLoaded=false;
async function ensureFaceApi(){
  if(!window.faceapi) await loadScriptOnce(FACE_CDN);
  if(!window.faceapi) throw new Error('faceapi_load_failed');
  if(!faceModelsLoaded){
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(FACE_MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL),
    ]);
    faceModelsLoaded=true;
  }
}
let stationBusy=false, stationLastTick=0, stationFaces=[], stationFaceReady=false;
async function startStation(){
  const video=document.getElementById('station-video');
  if(!video) return;
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
  }catch(e){
    stationSetMsg((e&&e.name==='NotFoundError')?t('stationCamMissing'):t('stationCamDenied'), 'err');
    return;
  }
  video.srcObject=stream;
  try{ await video.play(); }catch(e){}

  /* Chrome/Android maju rychlu vstavanu citacku (BarcodeDetector). iOS Safari
     ju nema, tam pouzijeme jsQR (dotiahneme az teraz, aby to nezatazovalo
     appku, ked skener nikto nepouziva). */
  let detector=null;
  if('BarcodeDetector' in window){
    try{ detector=new window.BarcodeDetector({formats:['qr_code']}); }catch(e){ detector=null; }
  }
  if(!detector) await loadScriptOnce('jsqr.js');

  const canvas=document.getElementById('station-canvas');
  const ctx=canvas.getContext('2d',{willReadFrequently:true});

  async function tick(now){
    if(!stationBusy && video.readyState>=2 && (now-stationLastTick)>180){
      stationLastTick=now;
      try{
        let code=null;
        if(detector){
          const codes=await detector.detect(video);
          if(codes&&codes.length) code=codes[0].rawValue;
        }else if(window.jsQR && video.videoWidth){
          canvas.width=video.videoWidth; canvas.height=video.videoHeight;
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          const img=ctx.getImageData(0,0,canvas.width,canvas.height);
          const res=window.jsQR(img.data,img.width,img.height);
          if(res) code=res.data;
        }
        if(code) handleStationCode(code);
      }catch(e){}
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* Rozpoznavanie tvare beží popri QR skeneri, nezavisle od neho — ak sa
     nenacita (napr. ziadny internet na CDN) alebo vlastnik ziadne tvare
     nenastavil, QR skenovanie funguje dalej bez zmeny. */
  (async()=>{
    try{
      const rows = await DB.stationFaceData(S.stationToken);
      if(!rows || !rows.length) return;
      await ensureFaceApi();
      stationFaces = rows.map(r=>({id:r.id, name:r.name,
        descriptors:(r.face_descriptors||[]).map(d=>new Float32Array(d))}));
      stationFaceReady = true;
      if(!stationBusy) stationSetMsg(t('stationReadyFace'), null);
    }catch(e){ /* ticho zlyha — stanica funguje dalej len s QR kodom */ }
  })();

  let faceLastTick=0;
  async function faceTick(now){
    if(stationFaceReady && !stationBusy && video.readyState>=2 && (now-faceLastTick)>700){
      faceLastTick=now;
      try{
        const det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks(true).withFaceDescriptor();
        if(det){
          let best=null, bestDist=Infinity;
          for(const person of stationFaces){
            for(const d of person.descriptors){
              const dist=faceapi.euclideanDistance(det.descriptor, d);
              if(dist<bestDist){ bestDist=dist; best=person; }
            }
          }
          if(best && bestDist<FACE_MATCH_THRESHOLD) handleStationFace(best.id, best.name);
        }
      }catch(e){}
    }
    requestAnimationFrame(faceTick);
  }
  requestAnimationFrame(faceTick);
}
async function handleStationCode(raw){
  const m=/^TURNO-EMP:(.+)$/.exec(String(raw||'').trim());
  if(!m) return;
  stationBusy=true;
  stationSetMsg('…', null);
  try{
    const r=await DB.empPunchStation(m[1], S.stationToken);
    if(!r) throw new Error('zly_kod');
    const label = r.action==='in' ? t('arrive') : r.action==='break' ? t('breakStart') : t('breakEnd');
    stationSetMsg((r.name?r.name+' — ':'')+label+' ✓', 'ok');
  }catch(e){
    const msg=String((e&&e.message)||'');
    stationSetMsg(msg.indexOf('zla_stanica')>=0 ? t('stationBadStation') : t('stationBadCode'), 'err');
  }
  setTimeout(()=>{ stationBusy=false; stationSetMsg(stationFaceReady?t('stationReadyFace'):t('stationReady'), null); }, 3500);
}
async function handleStationFace(employeeId, name){
  stationBusy=true;
  stationSetMsg('…', null);
  try{
    const r=await DB.punchStationFace(employeeId, S.stationToken);
    if(!r) throw new Error('zly_kod');
    const label = r.action==='in' ? t('arrive') : r.action==='break' ? t('breakStart') : t('breakEnd');
    stationSetMsg((((r&&r.name)||name)?((r&&r.name)||name)+' — ':'')+label+' ✓', 'ok');
  }catch(e){
    const msg=String((e&&e.message)||'');
    stationSetMsg(msg.indexOf('zla_stanica')>=0 ? t('stationBadStation') : t('stationBadCode'), 'err');
  }
  setTimeout(()=>{ stationBusy=false; stationSetMsg(stationFaceReady?t('stationReadyFace'):t('stationReady'), null); }, 3500);
}

  // Ribbon hore (moje hodiny/brutto) je vzdy za aktualny kalendarny mesiac —
  // nezavisle od toho, ktory mesiac si zamestnanec prave prehliada nizsie v mini-kalendari.
  const mine=all
    .filter(s=>{const d=new Date(s.date+'T00:00:00');return d.getFullYear()===y&&d.getMonth()===m});
  const h=mine.reduce((a,s)=>a+hoursOf(s),0);
  const bh=mine.reduce((a,s)=>a+breakHoursOf(s),0);

    if(!s.arrival){
      right=`<span class="tagl plan">${t('planLbl')}</span>
             <span class="mono">${esc(planLabel(s))}</span>`;
    }else if(!s.departure){
      right=`<span class="tagl on">${t('atWorkSince')}</span>
             <span class="mono">${hhmm(s.arrival)}</span>`;
    }else{
      const bb=breakHoursOf(s);
      right=`<span>${durLong(hoursOf(s))}</span>
             <span class="mono dim">${hhmm(s.arrival)}\u2013${hhmm(s.departure)}</span>
             ${bb>0?`<span class="dim">${t('breaksLbl')} ${durLong(bb)}</span>`:''}`;

    return `<div class="shift-row" style="grid-template-columns:1fr">
      <div class="sr-state">${right}</div>
    </div>${brs(s).length?breakList(s,true):''}`;
  }).join('');
  return `<div class="panel" style="margin-top:14px">
    <div class="eyebrow" style="margin-bottom:10px">${head}</div>
    ${rows}</div>`;
}

/* ---- skladanie casu z "HH:MM" na skutocny okamih ----
   Zmena v bare casto ide cez polnoc (22:00–02:30). Keby sme kazdy cas
   len prilepili na datum zmeny, prestavka o 01:00 by skoncila 24 hodin
   pred odchodom a hodiny by vysli negativne. Preto:
   prichod urcuje den, a kazdy dalsi cas, ktory by bol pred prichodom,
   posunieme na nasledujuci den. */
function mkAt(baseISO, hhmmStr){
  if(!hhmmStr)return null;
  const base=new Date(baseISO);
  const d=new Date(base.getFullYear(),base.getMonth(),base.getDate(),
                   +hhmmStr.slice(0,2), +hhmmStr.slice(3,5), 0, 0);
  return d;
}
function mkAfter(baseISO, hhmmStr){
  const d=mkAt(baseISO,hhmmStr);
  if(!d)return null;
  if(d<new Date(baseISO)) d.setDate(d.getDate()+1);   // je to uz po polnoci
  return d.toISOString();
}
/* precita prestavky z okna a vrati ich ako pole {s,e}, ukotvene na prichod */
function readBreaksFromSheet(anchorISO){
  const out=[];
  document.querySelectorAll('#f-breaks .brk-row').forEach(r=>{
    const sv=r.querySelector('.brk-s').value, ev=r.querySelector('.brk-e').value;
    if(!sv)return;                       // bez zaciatku prestavku nezapisujeme
    const st=mkAfter(anchorISO,sv);
    out.push({s:st, e:ev?mkAfter(st,ev):null});
  });
  return out;
}

function faceModalBody(id){

  return `<div class="scrim" data-act="scrim"><div class="sheet">

        background:conic-gradient(var(--verdigris) 0%, rgba(236,234,225,.18) 0%);transition:background .3s">
        <div style="width:100%;height:100%;border-radius:50%;overflow:hidden;background:#000">
          <video id="face-video" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1)"></video>
        </div>
      </div>

    </div>
