async function openFaceModal(id){
  window.__faceState = {id, descriptors:[], stream:null, done:false, lastCaptureAt:0, lastCheckAt:0};
  openModal(faceModalBody(id));
  const statusEl=document.getElementById('face-status');
  if(statusEl) statusEl.textContent=t('faceModelsLoading');
  try{
    await ensureFaceApi();
  }catch(e){
    if(document.getElementById('face-status')) document.getElementById('face-status').textContent=t('faceModelsErr');
    return;
  }
  const video=document.getElementById('face-video');
  if(!video || !window.__faceState) return; // medzitym zatvorene
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:true, audio:false});
    if(!window.__faceState){ stream.getTracks().forEach(tr=>tr.stop()); return; } // medzitym zatvorene
    window.__faceState.stream=stream;
    video.srcObject=stream;
    try{ await video.play(); }catch(e){}
  }catch(e){
    const el=document.getElementById('face-status');
    if(el) el.textContent = (e&&e.name==='NotFoundError')?t('stationCamMissing'):t('stationCamDenied');
    return;
  }
  const el=document.getElementById('face-status');
  if(el) el.textContent=t('faceCaptureHint').replace('{m}',FACE_SAMPLES);
  requestAnimationFrame(faceEnrollTick);
}
/* Bezi na pozadi, kym je okno otvorene: priebezne skusa najst presne jednu
   tvar a z casu na cas (aby vzorky neboli 3x ta ista snimka) si z nej
   spravi odtlacok. Po dosiahnuti FACE_SAMPLES sam ulozi a zavrie okno. */
async function faceEnrollTick(){
  const st=window.__faceState;
  if(!st || st.done) return; // okno zatvorene alebo uz hotovo — slucka konci
  const video=document.getElementById('face-video');
  const statusEl=document.getElementById('face-status');
  const consentEl=document.getElementById('face-consent');
  if(!video||!consentEl){ requestAnimationFrame(faceEnrollTick); return; }
  if(!consentEl.checked){
    if(statusEl) statusEl.textContent=t('faceConsentRequired');
    requestAnimationFrame(faceEnrollTick);
    return;
  }
  const now = (window.performance&&performance.now) ? performance.now() : Date.now();
  if(video.readyState>=2 && window.faceapi && (now-st.lastCheckAt)>350){
    st.lastCheckAt=now;
    try{
      const dets = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks(true).withFaceDescriptors();
      const cur=window.__faceState;
      if(!cur || cur.done) return; // medzitym zatvorene/hotovo
      if(!dets || dets.length===0){ if(statusEl) statusEl.textContent=t('faceNoFaceDetected'); }
      else if(dets.length>1){ if(statusEl) statusEl.textContent=t('faceMultipleFaces'); }
      else if((now-cur.lastCaptureAt)>700){
        cur.lastCaptureAt=now;
        cur.descriptors.push(Array.from(dets[0].descriptor));
        if(statusEl) statusEl.textContent=t('faceCaptureProgress').replace('{n}',cur.descriptors.length).replace('{m}',FACE_SAMPLES);
        const ringEl=document.getElementById('face-ring');
        if(ringEl) ringEl.style.background='conic-gradient(var(--verdigris) '+Math.round(cur.descriptors.length/FACE_SAMPLES*100)+'%, rgba(236,234,225,.18) 0%)';
        if(cur.descriptors.length>=FACE_SAMPLES){
          cur.done=true;
          finishFaceEnrollment(cur);
          return; // slucka konci, okno sa o chvilu samo zavrie
        }
      }
    }catch(e){ /* jeden pokus sa nepodaril — skusi znova o chvilu */ }
  }
  requestAnimationFrame(faceEnrollTick);
}
async function finishFaceEnrollment(st){
  const statusEl=document.getElementById('face-status');
  if(statusEl) statusEl.textContent=t('faceSaveDone');
  try{
    await DB.saveEmployeeFace(st.id, st.descriptors);
    const r=S.employees.find(x=>x.id===st.id);
    if(r){ r.face_descriptors=st.descriptors; r.face_consent_at=new Date().toISOString(); }
  }catch(err){ dbErr(err); }
  setTimeout(()=>{ closeModal(); toast(t('faceSaveDone')); render(); }, 700);
}

const RO_ALLOWED = ['close','scrim','copy-iban','copy-invite','detail','install-app','lang',
  'ltab','month','pay-plan','pickday','plan-month','plan-pick','mine-month','mine-pick','show-pricing','signout','view',
  'signin-owner','signin-emp','signup-owner','do-join','demo',
  'qr-toggle','qr-copy','qr-print','my-qr','theme-toggle','theme','landing-go','back-landing','geo-enable','signin-google','pay-history'];
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act;

  if(a==='scrim'&&ev.target!==el)return;

  /* Rezim len na citanie: prezerat sa da vsetko (aj hodiny a mzdy),
     zapisovat sa neda nic. Whitelist, nie blacklist — nova akcia je
     radsej omylom zablokovana, nez aby omylom presla. */
  if(S.readonly && RO_ALLOWED.indexOf(a)===-1){ toast(t('roToast')); return; }

  switch(a){
    case 'lang': setLang(el.dataset.v); render(); break;
    case 'ltab': S.loginTab=el.dataset.v; S.loginErr=''; S.signupDone=false; render(); break;
    case 'install-app': {
      if(S.installPrompt){
        S.installPrompt.prompt();
        try{ await S.installPrompt.userChoice; }catch(e){}
        S.installPrompt=null; render();
      } else {
        S.installHint=!S.installHint; render();
      }
      break;
    }
    case 'view': S.view=el.dataset.v;
      if(S.view==='admin' && S.adminRows===null) loadAdmin(); render(); break;
    case 'export-csv': exportMonthCsv(); break;
    case 'my-qr': openModal(myQrModalBody()); setTimeout(drawMyQR,0); break;
    case 'month': S.calCursor=new Date(S.calCursor.getFullYear(),S.calCursor.getMonth()+(+el.dataset.v),1);
                  S.calPick=null; render(); break;
    case 'pickday': S.calPick = S.calPick===el.dataset.v ? null : el.dataset.v; render(); break;
    case 'plan-month': S.planCursor=new Date(S.planCursor.getFullYear(),S.planCursor.getMonth()+(+el.dataset.v),1);
                  S.planPick=null; render(); break;
    case 'plan-pick': S.planPick = S.planPick===el.dataset.v ? null : el.dataset.v; render(); break;
    case 'mine-month': S.mineCursor=new Date(S.mineCursor.getFullYear(),S.mineCursor.getMonth()+(+el.dataset.v),1);
                  S.minePick=null; render(); break;
    case 'mine-pick': S.minePick = S.minePick===el.dataset.v ? null : el.dataset.v; render(); break;
    case 'detail': S.detail=!S.detail; render(); break;
    case 'mode': {
      const v=el.dataset.v;
      if(v===S.punchMode)break;
      S.punchMode=v;
      try{ await DB.savePunchMode(v); toast(t('saved')); }catch(e){ dbErr(e); }
      render(); break;
    }
    case 'theme': setTheme(el.dataset.v); render(); break;
    case 'theme-toggle': setTheme(S.theme==='dark'?'light':'dark'); render(); break;
    case 'landing-go': S.landing=false; S.loginTab=el.dataset.v; S.loginErr=''; S.signupDone=false; render(); break;
    case 'back-landing': S.landing=true; render(); break;

    case 'preset': {
      const f=el.dataset.f, to=el.dataset.t;
      modalHost.querySelectorAll('[data-act=preset]').forEach(b=>b.setAttribute('aria-pressed','false'));
      el.setAttribute('aria-pressed','true');
      const custom=document.getElementById('m-custom');
      if(!f){ custom.classList.remove('hide'); }
      else{
        custom.classList.add('hide');
        document.getElementById('m-from').value=f;
        document.getElementById('m-to').value=to;
      }
      break;
    }

    case 'undo': {
      if(!S.undo)break;
      const {id,field}=S.undo;
      await DB.updateShift(id,{[field]:null});
      const sh=S.shifts.find(x=>x.id===id); if(sh)sh[field]=null;
      S.undo=null; render(); break;
    }

    case 'save-fix': {
      const id=el.dataset.id;
      const sh=S.shifts.find(x=>x.id===id); if(!sh)break;
      const av=document.getElementById('f-arr').value;
      const dv=document.getElementById('f-dep').value;
      // den prichodu: ak uz prichod existuje, drzime jeho den (kvoli nocnym zmenam)
      const newEmp=(document.getElementById('f-emp')||{}).value || sh.employee_id;
      const ps=(document.getElementById('f-ps')||{}).value || null;
      const pe=(document.getElementById('f-pe')||{}).value || null;
      const anchor = sh.arrival || (sh.date+'T00:00:00');
      const aD = mkAt(anchor, av);
      const a  = aD ? aD.toISOString() : null;
      const dp = a ? mkAfter(a, dv) : null;
      if(a&&dp&&new Date(dp)<=new Date(a)){ toast(t('badTime')); return; }
      // 16:00 -> 09:00 je platna nocna zmena, ale 17 hodin je skoro vzdy preklep
      if(a&&dp&&(new Date(dp)-new Date(a))/3600000>16){ toast(t('tooLong')); return; }
      const bl = a ? readBreaksFromSheet(a) : [];
      // prestavka musi lezat v zmene, inak by vysli negativne hodiny.
      // Zly riadok oznacime cerveno, aby uzivatel videl KTORY to je —
      // samotna hlaska mu nepovie, kde hladat.
      const rowsEl=document.querySelectorAll('#f-breaks .brk-row');
      rowsEl.forEach(r=>r.classList.remove('bad'));
      let badAt=-1;
      bl.forEach((b,i)=>{
        if(badAt>=0)return;
        if(b.e&&new Date(b.e)<=new Date(b.s)) badAt=i;
        else if(a&&new Date(b.s)<new Date(a)) badAt=i;
        else if(dp&&b.e&&new Date(b.e)>new Date(dp)) badAt=i;
      });
      if(badAt>=0){
        const r=rowsEl[badAt];
        if(r){ r.classList.add('bad'); r.scrollIntoView({block:'center'}); }
        toast(t('badBreak')); return;
      }
      try{
        await DB.updateShift(id,{employee_id:newEmp,plan_start:ps,plan_end:pe,

        sh.employee_id=newEmp; sh.plan_start=ps; sh.plan_end=pe;

      break;

      el.disabled=true; // zabrani dvojitemu odoslaniu pri pomalej sieti / dvojitom kliku
      try{
        const e=await DB.addEmployee({name,position:position||null,hourly_rate:rate,access_code:makeCode()});
        S.employees.push(e); S.employees.sort((a,b)=>a.name.localeCompare(b.name));
        closeModal(); toast(t('added')); render();
      }catch(err){
        el.disabled=false;
        if((err&&err.message)==='people_limit_reached'){ openPricingModal(true); }
        else dbErr(err);
      }
      break;
    }
    case 'del-person': {
      if(!confirm(t('confirmRemovePerson')))return;
      const id=el.dataset.id;
      try{
        await DB.removeEmployee(id);
        S.employees=S.employees.filter(x=>x.id!==id);
        S.shifts=S.shifts.filter(x=>x.employee_id!==id);
        toast(t('removed')); render();
      }catch(err){ dbErr(err); }
      break;
    }
    case 'face-open': openFaceModal(el.dataset.id); break;
    case 'face-clear': {
      if(!confirm(t('confirmClearFace')))return;
      const id=el.dataset.id;
      try{
        await DB.clearEmployeeFace(id);
        const r=S.employees.find(x=>x.id===id); if(r){ r.face_descriptors=null; r.face_consent_at=null; }
        toast(t('faceClearedToast')); render();
      }catch(err){ dbErr(err); }
      break;
    }
    case 'pay-open': openModal(payModalBody(el.dataset.id)); break;
    case 'pay-confirm': {
      const employeeId=el.dataset.id;
      const list=document.getElementById('pay-day-list');
      const checked = list ? Array.from(list.querySelectorAll('.pay-day-cb:checked')) : [];
      if(!checked.length){ toast(t('payOutNone')); break; }
      const dates = checked.map(cb=>cb.dataset.date);
      const amount = checked.reduce((a,cb)=>a+(parseFloat(cb.dataset.amt)||0),0);
      el.disabled=true;
      try{
        const row = await DB.addPayment({employee_id:employeeId, dates, amount:+amount.toFixed(2)});
        (S.payments=S.payments||[]).push(row || {id:'pay'+Date.now(), employee_id:employeeId, dates, amount:+amount.toFixed(2), created_at:new Date().toISOString()});
        closeModal();
        toast(t('payOutDone'));
        render();
      }catch(err){ el.disabled=false; dbErr(err); }
      break;
    }
    case 'pay-history': openModal(payHistoryBody(el.dataset.id)); break;
    case 'pay-undo': {
      if(!confirm(t('confirmUndoPayout')))break;
      const paymentId=el.dataset.id, employeeId=el.dataset.emp;
      el.disabled=true;
      try{
        await DB.removePayment(paymentId);
        S.payments=(S.payments||[]).filter(p=>p.id!==paymentId);
        toast(t('payoutUndone'));
        openModal(payHistoryBody(employeeId));
        render();
      }catch(err){ el.disabled=false; dbErr(err); }
      break;
    }
    case 'new-note': openNoteModal(); break;
    case 'edit-note': {
      const n=(S.notes||[]).find(x=>x.id===el.dataset.id);
      if(n) openNoteModal(n);
      break;
    }
    case 'save-note': {
      const id=el.dataset.id;
      const title=(document.getElementById('n-title').value||'').trim();
      const details=(document.getElementById('n-details').value||'').trim();
      const priceRaw=document.getElementById('n-price').value;
      const price=priceRaw===''?null:parseFloat(priceRaw)||0;
      if(!title){ toast(t('nameRequired')); return; }
      try{
        if(id){
          await DB.updateNote(id,{title,details,price});
          const n=S.notes.find(x=>x.id===id); if(n){ n.title=title; n.details=details; n.price=price; }
        } else {
          const n=await DB.addNote({title,details,price});
          S.notes.unshift(n);
        }
        closeModal(); toast(t('saved')); render();
      }catch(err){ dbErr(err); }
      break;
    }
    case 'toggle-note': {
      const id=el.dataset.id;
      const n=(S.notes||[]).find(x=>x.id===id);
      if(!n) break;
      const done=!n.done;
      try{ await DB.updateNote(id,{done}); n.done=done; render(); }catch(err){ dbErr(err); }
      break;
    }
    case 'del-note': {
      const id=el.dataset.id;
      try{
        await DB.removeNote(id);
        S.notes=S.notes.filter(x=>x.id!==id);
        toast(t('removed')); render();
      }catch(err){ dbErr(err); }
      break;
    }
    case 'close': closeModal(); break;
    case 'scrim': closeModal(); break;   // tap na tmavu plochu zatvori
  }
});

/* rate edit */
document.addEventListener('change',async ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.act==='langsel'){ setLang(el.value); render(); return; }
  if(el.dataset&&el.dataset.act==='cal-filter'){ S.calFilter=el.value||null; render(); return; }
  if(el.dataset&&el.dataset.act==='pay-tier'){
    S.payTier = parseInt(el.value,10)||3;
    if(S.subModal) openModal(subModalBody()); else render();
    return;
  }
  if(el.dataset&&el.dataset.act==='rate'){
    const v=parseFloat(el.value)||0;
    try{
      await DB.updateEmployee(el.dataset.id,{hourly_rate:v});
      const e=empById(el.dataset.id); if(e)e.hourly_rate=v;
      toast(t('saved'));
    }catch(err){ dbErr(err); }
  }
  if(el.dataset&&el.dataset.act==='pay-day'){
    const list=document.getElementById('pay-day-list');
    let sum=0;
    if(list) list.querySelectorAll('.pay-day-cb:checked').forEach(cb=>sum+=parseFloat(cb.dataset.amt)||0);
    const out=document.getElementById('pay-total-amt');
    if(out) out.textContent=money(sum);
    return;
  }
  if(el.dataset&&el.dataset.act==='position'){
    const v=(el.value||'').trim();
    try{
      await DB.updateEmployee(el.dataset.id,{position:v||null});
      const e=empById(el.dataset.id); if(e)e.position=v||null;
      toast(t('saved'));
    }catch(err){ dbErr(err); }
  }
});

/* ---------- live tick: hodiny bežiacich zmien + hodiny v hlavičke ---------- */
setInterval(()=>{
  const c=document.getElementById('liveclock');
  if(c){const d=new Date();c.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
  document.querySelectorAll('[data-tick]').forEach(node=>{
    const s=S.shifts.find(x=>x.id===node.dataset.tick);
    if(s)node.textContent=durLong(hoursOf(s));
  });
  if(S.role==='owner'&&S.view==='today'){
    const now=Date.now(); let hrs=0,cost=0;
    shiftsOn(todayISO()).forEach(s=>{
      const e=empById(s.employee_id); if(!e)return;
      const h=hoursOf(s,now); hrs+=h; cost+=h*(+e.hourly_rate||0);
    });
    const hn=document.querySelector('[data-live=hours]'), cn=document.querySelector('[data-live=cost]');
    if(hn)hn.textContent=num(hrs,1);
    if(cn)cn.textContent=money(cost);
  }
},1000);

/* ---------- boot ---------- */
(async function boot(){
  setLang(langFromUrl());
  /* Stanica nepotrebuje ziadne prihlasenie, ide rovno do skenera. */
  S.stationToken=stationTokenFromUrl();
  if(S.stationToken){ render(); startStation(); return; }
  const jc=joinCodeFromUrl();
  if(jc){ S.joinCode=jc; S.loginTab='join'; S.landing=false; }
  S.qrScanned=qrFromUrl();
  if(S.qrScanned){ S.loginTab='employee'; S.landing=false; clearQrFromUrl(); }
  if(LIVE){
    try{
      const ses=await DB.session();
      if(ses){
        S.employees=await DB.loadEmployees();
        S.shifts=await DB.loadShifts();
        try{ S.notes=await DB.loadNotes(); }catch(e){}
        try{ S.payments=await DB.loadPayments(); }catch(e){ S.payments=[]; }
        try{ const st=await DB.loadSettings(); applySettings(st); }catch(e){}
        S.role='owner';
      }
    }catch(e){console.warn(e)}
    /* Zamestnanec sa neprihlasuje cez Supabase Auth, len kodom, takze DB.session()
       o nom nic nevie. Bez tejto obnovy ho kazdy refresh / potiahnutie zhora
       odhlasi (viz TURNO-stav.md, bod "odhlasovanie po obnoveni stranky"). */
    if(!S.role){
      let savedCode=null;
      try{ savedCode=localStorage.getItem(EMP_CODE_KEY); }catch(e){}
      if(savedCode){
        try{
          const me=await DB.employeeByCode(savedCode);
          if(me){
            try{ S.shifts=await DB.employeeShifts(savedCode); }catch(e2){ S.shifts=[]; }
            S.employees=[me]; S.me=me; S.myCode=savedCode; S.platneDo=me.platne_do||null;
            S.geoOn=!!me.geo_on; S.geoRadius=me.geo_radius||100;
            S.geoLat=me.geo_lat===null?null:Number(me.geo_lat); S.geoLon=me.geo_lon===null?null:Number(me.geo_lon);
            S.geoMode=me.geo_mode==='polygon'?'polygon':'circle';
            S.geoPolygon=Array.isArray(me.geo_polygon)?me.geo_polygon:null;
            S.role='employee';
          }else{
            /* kod uz neplati (napr. zamestnanca vlastnik zmazal) */
            try{ localStorage.removeItem(EMP_CODE_KEY); }catch(e2){}
          }
        }catch(e){
          /* vypadok siete pri starte — kod v localStorage nechavame,
             skusi sa znova pri buduc otvoreni, clovek neprisiel o prihlasenie */
          console.warn(e);
        }
      }
    }
  }
  render();
  if(S.role==='employee') ensureGeoPermission();
  /* Navrat zo Stripe Checkoutu/portálu — webhook, ktory realne aktualizuje
     people_limit v Supabase, moze dobehnut o pár sekúnd neskor ako presmerovanie
     spat do appky, tak to na zaciatku par-krat skusime dotiahnut. */
  const checkoutStatus = checkoutStatusFromUrl();
  if(checkoutStatus){
    clearCheckoutFromUrl();
    if(checkoutStatus==='success'){
      toastLong(t('checkoutSuccessMsg'));
      if(LIVE && S.role==='owner'){
        const before=S.peopleLimit;
        for(let i=0;i<6;i++){
          await new Promise(r=>setTimeout(r,2000));
          try{
            const st=await DB.loadSettings();
            applySettings(st);
            if(S.peopleLimit!==before){ render(); break; }
          }catch(e){ break; }
        }
      }
    } else if(checkoutStatus==='cancel'){
      toast(t('checkoutCancelMsg'));
    }
  }
  /* Ked sa telefon prebudi/appka vrati na popredie, over ci este plati
     prihlasenie — predtym prvy tap po dlhsej pauze proste tichoe zlyhal. */
  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState==='visible' && LIVE && sb && S.role==='owner'){
      try{
        const {data}=await sb.auth.getSession();
        if(data.session) return;
        /* Prve overenie po prebudeni telefonu casto zlyha samo o sebe
           (Supabase klient este nestihol obnovit token) — kym vlastnika
           odhlasime, skusime to este raz o chvilu neskor. */
        await new Promise(r=>setTimeout(r,1500));
        const {data:data2}=await sb.auth.getSession();
        if(!data2.session){ S.role=null; S.loginErr=''; render(); }
      }catch(e){}
    }
  });
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault();
    S.installPrompt=e;
    render();
  });
  window.addEventListener('appinstalled', ()=>{
    S.installPrompt=null; S.installHint=false; render();
  });
})();
