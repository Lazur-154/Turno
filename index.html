const RO_ALLOWED = ['close','scrim','copy-iban','copy-invite','detail','install-app','lang',
  'ltab','month','openday','pay-plan','pickday','show-pricing','signout','view','week',
  'signin-owner','signin-emp','signup-owner','do-join','demo'];
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act;

  if(a==='scrim'&&ev.target!==el)return;

  /* Rezim len na citanie: prezerat sa da vsetko (aj hodiny a mzdy),
     zapisovat sa neda nic. Whitelist, nie blacklist — nova akcia je
     radsej omylom zablokovana, nez aby omylom presla. */
  if(S.readonly && RO_ALLOWED.indexOf(a)===-1){ toast(t('roToast')); return; }

  switch(a){
    case 'lang': setLang(el.dataset.v); render(); break;
    case 'ltab': S.loginTab=el.dataset.v; S.loginErr=''; S.signupDone=false; render(); break;
    case 'install-app': {
      if(S.installPrompt){
        S.installPrompt.prompt();
        try{ await S.installPrompt.userChoice; }catch(e){}
        S.installPrompt=null; render();
      } else {
        S.installHint=!S.installHint; render();
      }
      break;
    }
    case 'view': S.view=el.dataset.v;
      if(S.view==='admin' && S.adminRows===null) loadAdmin(); render(); break;
    case 'week': S.weekStart=addDays(S.weekStart,7*(+el.dataset.v)); S.dayOpen=null; render(); break;
    case 'month': S.calCursor=new Date(S.calCursor.getFullYear(),S.calCursor.getMonth()+(+el.dataset.v),1);
                  S.calPick=null; render(); break;
    case 'pickday': S.calPick = S.calPick===el.dataset.v ? null : el.dataset.v; render(); break;
    case 'detail': S.detail=!S.detail; render(); break;
    case 'mode': {
      const v=el.dataset.v;
      if(v===S.punchMode)break;
      S.punchMode=v;
      try{ await DB.savePunchMode(v); toast(t('saved')); }catch(e){ dbErr(e); }
      render(); break;
    }
    case 'openday': S.dayOpen = S.dayOpen===el.dataset.v ? null : el.dataset.v; render(); break;

    case 'preset': {
      const f=el.dataset.f, to=el.dataset.t;
      modalHost.querySelectorAll('[data-act=preset]').forEach(b=>b.setAttribute('aria-pressed','false'));
      el.setAttribute('aria-pressed','true');
      const custom=document.getElementById('m-custom');
      if(!f){ custom.classList.remove('hide'); }
      else{
        custom.classList.add('hide');
        document.getElementById('m-from').value=f;
        document.getElementById('m-to').value=to;
      }
      break;
    }

    case 'undo': {
      if(!S.undo)break;
      const {id,field}=S.undo;
      await DB.updateShift(id,{[field]:null});
      const sh=S.shifts.find(x=>x.id===id); if(sh)sh[field]=null;
      S.undo=null; render(); break;
    }

    case 'break-start': {
      const id=el.dataset.id;
      const sh=S.shifts.find(x=>x.id===id); if(!sh||onBreak(sh))break;
      const list=brs(sh).concat([{s:new Date().toISOString(),e:null}]);
      await DB.updateShift(id,{breaks:list});
      sh.breaks=list; S.justStamped=id; render(); S.justStamped=null; break;
    }
    case 'break-end': {
      const id=el.dataset.id;
      const sh=S.shifts.find(x=>x.id===id); const b=sh&&onBreak(sh); if(!b)break;
      const list=brs(sh).slice(); list[list.length-1]={...b,e:new Date().toISOString()};
      await DB.updateShift(id,{breaks:list});
      sh.breaks=list; S.justStamped=id; render(); S.justStamped=null; break;
    }

    /* Zamestnanec si zapisuje sam. Vzdy cez DB.empPunch — o tom,
       ci to smie, rozhoduje databaza, nie tento kod. */
    case 'my-start': {
      try{
        const sh=await DB.empStart(S.myCode);
        if(sh){ S.shifts.push(sh); S.justStamped=sh.id; }
        render(); S.justStamped=null;
      }catch(e){ toast(t('readOnlyNote')); }
      break;
    }
    case 'my-in': case 'my-out': case 'my-break-start': case 'my-break-end': {
      const map={'my-in':'in','my-out':'out','my-break-start':'break_start','my-break-end':'break_end'};
      const id=el.dataset.id;
      try{
        const upd=await DB.empPunch(S.myCode, id, map[a]);
        if(upd){
          const i=S.shifts.findIndex(x=>x.id===id);
          if(i>=0) S.shifts[i]={...S.shifts[i], ...upd};
        }
        S.justStamped=id; render(); S.justStamped=null;
      }catch(e){ toast(t('readOnlyNote')); }
      break;
    }

    case 'fix': openFixModal(el.dataset.id); break;
    /* Riadky prestavok menime priamo v okne, BEZ prekreslenia.
       Predtym sa okno prekreslilo a zmazalo ostatne neulozene upravy
       (osobu, plan, prichod) — to bola chyba. */
    case 'brk-add': {
      const host=document.getElementById('f-breaks'); if(!host)break;
      const help=host.querySelector('.help'); if(help)help.remove();
      host.insertAdjacentHTML('beforeend', breakRowHtml(el.dataset.id));
      const last=host.querySelector('.brk-row:last-child .brk-s');
      if(last&&last.focus)try{last.focus({preventScroll:true})}catch(e){}
      break;
    }
    case 'brk-del': {
      const row=el.closest('.brk-row'); if(!row)break;
      const host=row.parentElement;
      row.remove();
      if(host&&!host.querySelector('.brk-row')){
        host.innerHTML=`<div class="help" style="margin:0">${t('noBreaks')}</div>`;
      }
      break;
    }
    case 'save-fix': {
      const id=el.dataset.id;
      const sh=S.shifts.find(x=>x.id===id); if(!sh)break;
      const av=document.getElementById('f-arr').value;
      const dv=document.getElementById('f-dep').value;
      // den prichodu: ak uz prichod existuje, drzime jeho den (kvoli nocnym zmenam)
      const newEmp=(document.getElementById('f-emp')||{}).value || sh.employee_id;
      const ps=(document.getElementById('f-ps')||{}).value || null;
      const pe=(document.getElementById('f-pe')||{}).value || null;
      const anchor = sh.arrival || (sh.date+'T00:00:00');
      const aD = mkAt(anchor, av);
      const a  = aD ? aD.toISOString() : null;
      const dp = a ? mkAfter(a, dv) : null;
      if(a&&dp&&new Date(dp)<=new Date(a)){ toast(t('badTime')); return; }
      // 16:00 -> 09:00 je platna nocna zmena, ale 17 hodin je skoro vzdy preklep
      if(a&&dp&&(new Date(dp)-new Date(a))/3600000>16){ toast(t('tooLong')); return; }
      const bl = a ? readBreaksFromSheet(a) : [];
      // prestavka musi lezat v zmene, inak by vysli negativne hodiny.
      // Zly riadok oznacime cerveno, aby uzivatel videl KTORY to je —
      // samotna hlaska mu nepovie, kde hladat.
      const rowsEl=document.querySelectorAll('#f-breaks .brk-row');
      rowsEl.forEach(r=>r.classList.remove('bad'));
      let badAt=-1;
      bl.forEach((b,i)=>{
        if(badAt>=0)return;
        if(b.e&&new Date(b.e)<=new Date(b.s)) badAt=i;
        else if(a&&new Date(b.s)<new Date(a)) badAt=i;
        else if(dp&&b.e&&new Date(b.e)>new Date(dp)) badAt=i;
      });
      if(badAt>=0){
        const r=rowsEl[badAt];
        if(r){ r.classList.add('bad'); r.scrollIntoView({block:'center'}); }
        toast(t('badBreak')); return;
      }
      try{
        await DB.updateShift(id,{employee_id:newEmp,plan_start:ps,plan_end:pe,
                                arrival:a,departure:dp,breaks:bl});
        sh.employee_id=newEmp; sh.plan_start=ps; sh.plan_end=pe;
        sh.arrival=a; sh.departure=dp; sh.breaks=bl;
        closeModal(); toast(t('saved')); render();
      }catch(err){ dbErr(err); }
      break;
    }
    case 'clear-dep': {
      const id=el.dataset.id;
      await DB.updateShift(id,{departure:null});
      const sh=S.shifts.find(x=>x.id===id); if(sh)sh.departure=null;
      closeModal(); toast(t('saved')); render(); break;
    }

    case 'demo': {
      seedDemo(); S.employees=await DB.loadEmployees(); S.shifts=await DB.loadShifts(); S.notes=await DB.loadNotes();
      const st=await DB.loadSettings(); S.punchMode=st.punch_mode||'owner'; S.inviteCode=st.invite_code||null; S.peopleLimit=st.people_limit||3; S.platneDo=st.platne_do||null; S.typPredplatneho=st.typ_predplatneho||'mesacne';
      S.role='owner'; S.view='today'; render(); break;
    }

    case 'signin-owner': {
      const email=(document.getElementById('li-email').value||'').trim();
      const pass=document.getElementById('li-pass').value||'';
      if(!LIVE){ S.loginErr=t('demoNote'); render(); return; }
      try{
        await DB.signIn(email,pass);
        S.employees=await DB.loadEmployees(); S.shifts=await DB.loadShifts(); try{ S.notes=await DB.loadNotes(); }catch(e){}
        try{ const st=await DB.loadSettings(); S.punchMode=st.punch_mode||'owner'; S.inviteCode=st.invite_code||null; S.peopleLimit=st.people_limit||3; S.platneDo=st.platne_do||null; S.typPredplatneho=st.typ_predplatneho||'mesacne'; }catch(e){}
        S.role='owner'; S.loginErr=''; render();
      }catch(e){ S.loginErr=t('badLogin'); render(); }
      break;
    }
    case 'signup-owner': {
      const email=(document.getElementById('su-email').value||'').trim();
      const p1=document.getElementById('su-pass').value||'';
      const p2=document.getElementById('su-pass2').value||'';
      if(!LIVE){ S.loginErr=t('demoNote'); render(); return; }
      if(!email){ S.loginErr=t('badLogin'); render(); return; }
      if(p1.length<6){ S.loginErr=t('passTooShort'); render(); return; }
      if(p1!==p2){ S.loginErr=t('passMismatch'); render(); return; }
      el.disabled=true;
      try{
        await DB.signUp(email,p1);
        S.signupDone=true; S.loginErr=''; render();
      }catch(err){
        S.loginErr = (err&&err.message) || t('badLogin');
        render();
      }
      break;
    }
    case 'do-join': {
      const name=(document.getElementById('j-name').value||'').trim();
      if(!name){ S.loginErr=t('nameRequired'); render(); return; }
      el.disabled=true;
      try{
        const res=await DB.selfRegister(S.joinCode, name);
        if(!res || !res.access_code){ S.loginErr=t('joinBadCode'); render(); return; }
        let me=null;
        try{ me=await DB.employeeByCode(res.access_code); }catch(e2){}
        if(!me) me={id:res.id, name:res.name, hourly_rate:0, access_code:res.access_code};
        try{ S.shifts=await DB.employeeShifts(res.access_code); }catch(e2){ S.shifts=[]; }
        S.employees=[me]; S.me=me; S.myCode=res.access_code; S.platneDo=me.platne_do||null;
        S.role='employee'; S.loginErr='';
        clearJoinFromUrl();
        render();
      }catch(err){
        S.loginErr=t('joinBadCode'); render();
      }
      break;
    }
    case 'admin-reload': S.adminRows=null; render(); loadAdmin(); break;
    case 'admin-add': {
      const kod=el.dataset.kod, typ=el.dataset.typ;
      if(!confirm('Predĺžiť predplatné firme '+kod+' o '+(typ==='rocne'?'jeden rok':'jeden mesiac')+'?')) break;
      S.adminBusy=true; render();
      try{
        const res=await DB.adminPredlz(kod,typ,1);
        const novy=(res&&res[0]&&res[0].plati_do)||null;
        toast(kod+' \u2013 platí do '+(novy?fmtDay(novy):'?'));
        if(kod===S.inviteCode && novy){ S.platneDo=novy; S.typPredplatneho=typ; }
      }catch(err){ dbErr(err); }
      S.adminBusy=false; S.adminRows=null; render(); loadAdmin();
      break;
    }
    case 'pay-plan': S.payPlan=el.dataset.v;
      if(S.subModal) openModal(subModalBody()); else render();
      break;
    case 'copy-iban': {
      const val = PAY_IBAN.replace(/\s+/g,'');
      try{ await navigator.clipboard.writeText(val); toast(t('ibanCopied')); }
      catch(e){ toast(t('ibanCopied')); }
      break;
    }
    case 'copy-invite': {
      const inp=document.getElementById('invite-link');
      const val = inp ? inp.value : '';
      if(!val) break;
      try{
        await navigator.clipboard.writeText(val);
        toast(t('linkCopied'));
      }catch(e){
        try{ inp.select(); document.execCommand('copy'); toast(t('linkCopied')); }catch(e2){}
      }
      break;
    }
    case 'regen-invite': {
      if(!confirm(t('regenConfirm')))break;
      try{
        const code=await DB.regenerateInvite();
        S.inviteCode=code; toast(t('saved')); render();
      }catch(err){ dbErr(err); }
      break;
    }
    case 'signin-emp': {
      const code=(document.getElementById('li-code').value||'').trim();
      let me=null;
      try{ me=await DB.employeeByCode(code); }catch(e){ console.warn(e); }
      if(!me){ S.loginErr=t('badCode'); render(); return; }
      try{ S.shifts=await DB.employeeShifts(code); }catch(e){ S.shifts=[]; }
      if(!LIVE){ try{ S.punchMode=(await DB.loadSettings()).punch_mode||'owner'; }catch(e){} }
      S.employees=[me]; S.me=me; S.myCode=code; S.platneDo=me.platne_do||null;
      S.role='employee'; S.loginErr=''; render(); break;
    }
    case 'signout': await DB.signOut(); S.role=null; S.me=null; S.loginErr=''; S.platneDo=null; render(); break;

    case 'punch-in': {
      const id=el.dataset.id;
      const now=new Date().toISOString();
      try{
        await DB.updateShift(id,{arrival:now});
        S.shifts.find(x=>x.id===id).arrival=now;
        S.justStamped=id; setUndo(id,'arrival'); render(); S.justStamped=null;
      }catch(err){ dbErr(err); }
      break;
    }
    case 'punch-out': {
      const id=el.dataset.id;
      const now=new Date().toISOString();
      const sh=S.shifts.find(x=>x.id===id);
      // ak je prave na prestavke, uzavri ju tym istym casom
      const patch={departure:now};
      if(onBreak(sh)){
        const list=brs(sh).slice();
        list[list.length-1]={...list[list.length-1],e:now};
        patch.breaks=list; sh.breaks=list;
      }
      await DB.updateShift(id,patch);
      sh.departure=now;
      S.justStamped=id; setUndo(id,'departure'); render(); S.justStamped=null; break;
    }
    /* prichod bez planu — zmena sa zalozi az teraz */
    case 'quick-in': {
      const emp=el.dataset.id;
      const now=new Date().toISOString();
      const row={employee_id:emp,date:todayISO(),plan_start:null,plan_end:null,
                 arrival:now,departure:null,breaks:[]};
      try{
        const sh=await DB.addShift(row);
        S.shifts.push(sh); S.justStamped=sh.id; setUndo(sh.id,'arrival');
        render(); S.justStamped=null;
      }catch(err){ dbErr(err); }
      break;
    }

    case 'week-plan': openWeekModal(); break;

    case 'w-preset': {
      const f=el.dataset.f, to=el.dataset.t;
      modalHost.querySelectorAll('[data-act=w-preset]').forEach(b=>b.setAttribute('aria-pressed','false'));
      el.setAttribute('aria-pressed','true');
      const custom=document.getElementById('w-custom');
      if(!f){ custom.classList.remove('hide'); }
      else{
        custom.classList.add('hide');
        document.getElementById('w-from').value=f;
        document.getElementById('w-to').value=to;
      }
      break;
    }
    case 'w-day': {
      const on=el.getAttribute('aria-pressed')==='true';
      el.setAttribute('aria-pressed', on?'false':'true');
      break;
    }
    case 'save-week': {
      const emp=document.getElementById('w-emp').value;
      const f=document.getElementById('w-from').value;
      const to=document.getElementById('w-to').value;
      const picked=[...document.querySelectorAll('[data-act=w-day]')]
        .filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>+b.dataset.i);
      if(!picked.length){ toast(t('noDays')); return; }
      let made=0;
      for(const i of picked){
        const key=iso(addDays(S.weekStart,i));
        // ak uz v ten den zmenu ma, nezdvojujeme ju
        if(S.shifts.some(x=>x.employee_id===emp && x.date===key)) continue;
        try{
          const sh=await DB.addShift({employee_id:emp,date:key,plan_start:f,plan_end:to,
                                      arrival:null,departure:null,breaks:[]});
          S.shifts.push(sh); made++;
        }catch(err){ dbErr(err); closeModal(); render(); return; }
      }
      closeModal(); toast(t('createdN')+made); render(); break;
    }

    case 'new-shift': openShiftModal(el.dataset.date||todayISO()); break;
    case 'save-shift': {
      const emp=document.getElementById('m-emp').value;
      const date=document.getElementById('m-date').value;
      const f=document.getElementById('m-from').value;
      const to=document.getElementById('m-to').value;
      if(!emp){toast(t('pickPerson'));return;}
      const row={employee_id:emp,date,plan_start:f,plan_end:to,arrival:null,departure:null,breaks:[]};
      try{
        const s=await DB.addShift(row);
        S.shifts.push(s); S.dayOpen=date; closeModal(); toast(t('added')); render();
      }catch(err){ dbErr(err); }
      break;
    }
    case 'del-shift': {
      const id=el.dataset.id;
      try{
        await DB.removeShift(id);
        S.shifts=S.shifts.filter(x=>x.id!==id); toast(t('removed')); render();
      }catch(err){ dbErr(err); }
      break;
    }
    case 'new-person':
      if(S.employees.length>=(S.peopleLimit||3)){ openPricingModal(true); }
      else openPersonModal();
      break;
    case 'show-pricing': openPricingModal(false); break;
    case 'manage-sub': openSubModal(); break;
    case 'save-person': {
      const name=(document.getElementById('p-name').value||'').trim();
      const rate=parseFloat(document.getElementById('p-rate').value)||0;
      if(!name){toast(t('nameRequired'));return;}
      try{
        const e=await DB.addEmployee({name,hourly_rate:rate,access_code:makeCode()});
        S.employees.push(e); S.employees.sort((a,b)=>a.name.localeCompare(b.name));
        closeModal(); toast(t('added')); render();
      }catch(err){
        if((err&&err.message)==='people_limit_reached'){ openPricingModal(true); }
        else dbErr(err);
      }
      break;
    }
    case 'del-person': {
      if(!confirm(t('confirmRemovePerson')))return;
      const id=el.dataset.id;
      try{
        await DB.removeEmployee(id);
        S.employees=S.employees.filter(x=>x.id!==id);
        S.shifts=S.shifts.filter(x=>x.employee_id!==id);
        toast(t('removed')); render();
      }catch(err){ dbErr(err); }
      break;
    }
    case 'new-note': openNoteModal(); break;
    case 'edit-note': {
      const n=(S.notes||[]).find(x=>x.id===el.dataset.id);
      if(n) openNoteModal(n);
      break;
    }
    case 'save-note': {
      const id=el.dataset.id;
      const title=(document.getElementById('n-title').value||'').trim();
      const details=(document.getElementById('n-details').value||'').trim();
      const priceRaw=document.getElementById('n-price').value;
      const price=priceRaw===''?null:parseFloat(priceRaw)||0;
      if(!title){ toast(t('nameRequired')); return; }
      try{
        if(id){
          await DB.updateNote(id,{title,details,price});
          const n=S.notes.find(x=>x.id===id); if(n){ n.title=title; n.details=details; n.price=price; }
        } else {
          const n=await DB.addNote({title,details,price});
          S.notes.unshift(n);
        }
        closeModal(); toast(t('saved')); render();
      }catch(err){ dbErr(err); }
      break;
    }
    case 'toggle-note': {
      const id=el.dataset.id;
      const n=(S.notes||[]).find(x=>x.id===id);
      if(!n) break;
      const done=!n.done;
      try{ await DB.updateNote(id,{done}); n.done=done; render(); }catch(err){ dbErr(err); }
      break;
    }
    case 'del-note': {
      const id=el.dataset.id;
      try{
        await DB.removeNote(id);
        S.notes=S.notes.filter(x=>x.id!==id);
        toast(t('removed')); render();
      }catch(err){ dbErr(err); }
      break;
    }
    case 'close': closeModal(); break;
    case 'scrim': closeModal(); break;   // tap na tmavu plochu zatvori
  }
});

/* rate edit */
document.addEventListener('change',async ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.act==='langsel'){ setLang(el.value); render(); return; }
  if(el.dataset&&el.dataset.act==='rate'){
    const v=parseFloat(el.value)||0;
    try{
      await DB.updateEmployee(el.dataset.id,{hourly_rate:v});
      const e=empById(el.dataset.id); if(e)e.hourly_rate=v;
      toast(t('saved'));
    }catch(err){ dbErr(err); }
  }
});

/* ---------- live tick: hodiny bežiacich zmien + hodiny v hlavičke ---------- */
setInterval(()=>{
  const c=document.getElementById('liveclock');
  if(c){const d=new Date();c.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
  document.querySelectorAll('[data-tick]').forEach(node=>{
    const s=S.shifts.find(x=>x.id===node.dataset.tick);
    if(s)node.textContent=durLong(hoursOf(s));
  });
  if(S.role==='owner'&&S.view==='today'){
    const now=Date.now(); let hrs=0,cost=0;
    shiftsOn(todayISO()).forEach(s=>{
      const e=empById(s.employee_id); if(!e)return;
      const h=hoursOf(s,now); hrs+=h; cost+=h*(+e.hourly_rate||0);
    });
    const hn=document.querySelector('[data-live=hours]'), cn=document.querySelector('[data-live=cost]');
    if(hn)hn.textContent=num(hrs,1);
    if(cn)cn.textContent=money(cost);
  }
},1000);

/* ---------- boot ---------- */
(async function boot(){
  setLang(langFromUrl());
  const jc=joinCodeFromUrl();
  if(jc){ S.joinCode=jc; S.loginTab='join'; }
  if(LIVE){
    try{
      const ses=await DB.session();
      if(ses){
        S.employees=await DB.loadEmployees();
        S.shifts=await DB.loadShifts();
        try{ S.notes=await DB.loadNotes(); }catch(e){}
        try{ const st=await DB.loadSettings(); S.punchMode=st.punch_mode||'owner'; S.inviteCode=st.invite_code||null; S.peopleLimit=st.people_limit||3; S.platneDo=st.platne_do||null; S.typPredplatneho=st.typ_predplatneho||'mesacne'; }catch(e){}
        S.role='owner';
      }
    }catch(e){console.warn(e)}
  }
  render();
  /* Navrat zo Stripe Checkoutu/portálu — webhook, ktory realne aktualizuje
     people_limit v Supabase, moze dobehnut o pár sekúnd neskor ako presmerovanie
     spat do appky, tak to na zaciatku par-krat skusime dotiahnut. */
  const checkoutStatus = checkoutStatusFromUrl();
  if(checkoutStatus){
    clearCheckoutFromUrl();
    if(checkoutStatus==='success'){
      toastLong(t('checkoutSuccessMsg'));
      if(LIVE && S.role==='owner'){
        const before=S.peopleLimit;
        for(let i=0;i<6;i++){
          await new Promise(r=>setTimeout(r,2000));
          try{
            const st=await DB.loadSettings();
            S.peopleLimit=st.people_limit||3;
            S.platneDo=st.platne_do||null; S.typPredplatneho=st.typ_predplatneho||'mesacne';
            if(S.peopleLimit!==before){ render(); break; }
          }catch(e){ break; }
        }
      }
    } else if(checkoutStatus==='cancel'){
      toast(t('checkoutCancelMsg'));
    }
  }
  /* Ked sa telefon prebudi/appka vrati na popredie, over ci este plati
     prihlasenie — predtym prvy tap po dlhsej pauze proste tichoe zlyhal. */
  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState==='visible' && LIVE && sb && S.role==='owner'){
      try{
        const {data}=await sb.auth.getSession();
        if(!data.session){ S.role=null; S.loginErr=''; render(); }
      }catch(e){}
    }
  });
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault();
    S.installPrompt=e;
    render();
  });
  window.addEventListener('appinstalled', ()=>{
    S.installPrompt=null; S.installHint=false; render();
  });
})();
</script>
